<body>

<header>

<div class="nav">

    </div>

    <a class="home-btn" href="index.html">

    </a>

</div>

</header>


<main class="container">


<!-- ================= SEARCH PAGE ================= -->

<section id="searchPage">

    <div class="hero">

        <h1>Football Player Database</h1>

        <p>
            Search for any football player and explore
            their available career statistics.
        </p>

    </div>


    <div class="search-area">

        <div class="search-box">

            <input
                id="searchInput"
                type="text"
                placeholder="Search Mbappe, Messi, Ronaldo..."
                autocomplete="off"
            >

            <button onclick="searchPlayers()">
                Search
            </button>

        </div>


        <div id="results">

            <div class="status">
                Search for a player to begin.
            </div>

        </div>

    </div>

</section>



<!-- ================= PROFILE PAGE ================= -->

<section id="profile">

    <button
        class="back-btn"
        onclick="backToSearch()"
    >
        ← Back to Search
    </button>


    <div id="profileContent"></div>

</section>

</main>



<script>

/* =====================================================
   ESPN ENDPOINTS
===================================================== */

const ESPN_SEARCH =
    "https://site.web.api.espn.com/apis/search/v2";

const ESPN_CORE =
    "https://sports.core.api.espn.com/v2/sports/soccer";

const ESPN_SITE =
    "https://site.api.espn.com/apis/site/v2/sports/soccer";


/* =====================================================
   HELPERS
===================================================== */

function normalize(text){

    return String(text || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .trim();

}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


async function getJSON(url){

    const response =
        await fetch(url);

    if(!response.ok){

        throw new Error(
            "HTTP " + response.status
        );

    }

    return await response.json();

}


/* =====================================================
   SEARCH
===================================================== */

async function searchPlayers(){

    const input =
        document.getElementById("searchInput");

    const query =
        input.value.trim();

    const results =
        document.getElementById("results");


    if(query.length < 2){

        results.innerHTML = `
            <div class="status">
                Please enter at least 2 characters.
            </div>
        `;

        return;

    }


    results.innerHTML = `
        <div class="loading">
            Searching for
            <strong>${escapeHTML(query)}</strong>...
        </div>
    `;


    try{

        /*
         First method:
         ESPN global search.
        */

        let players =
            await searchESPN(query);


        /*
         If the search response doesn't contain
         usable player objects, use the fallback
         database method.
        */

        if(!players.length){

            players =
                await fallbackPlayerSearch(query);

        }


        /*
         Final safety fallback for very common players.
         */

        if(!players.length){

            players =
                knownPlayerFallback(query);

        }


        if(!players.length){

            results.innerHTML = `
                <div class="status">

                    No player found for
                    <strong>${escapeHTML(query)}</strong>.

                    <br><br>

                    Try:
                    <br>
                    <b>Mbappe</b>,
                    <b>Messi</b>,
                    <b>Ronaldo</b>,
                    <b>Haaland</b>

                </div>
            `;

            return;

        }


        renderPlayers(players);

    }
    catch(error){

        console.error(
            "Search error:",
            error
        );


        /*
         Even if the global search endpoint
         fails, try the fallback database.
        */

        try{

            const players =
                await fallbackPlayerSearch(query);


            if(players.length){

                renderPlayers(players);
                return;

            }

        }
        catch(e){

            console.error(e);

        }


        /*
         Last fallback.
        */

        const known =
            knownPlayerFallback(query);


        if(known.length){

            renderPlayers(known);

            return;

        }


        results.innerHTML = `
            <div class="error">

                The player search service could not
                be reached right now.

                <br><br>

                Please try again.

            </div>
        `;

    }

}


/* =====================================================
   ESPN GLOBAL SEARCH
===================================================== */

async function searchESPN(query){

    const url =
        ESPN_SEARCH +
        "?query=" +
        encodeURIComponent(query) +
        "&sport=soccer" +
        "&limit=30";


    const data =
        await getJSON(url);


    const players = [];


    /*
     ESPN search results can contain nested
     contents, items and results.
    */

    function scan(obj){

        if(!obj || typeof obj !== "object"){
            return;
        }


        /*
         Possible athlete/player fields.
        */

        const id =
            obj.id ||
            obj.athleteId;


        const name =
            obj.displayName ||
            obj.fullName ||
            obj.name;


        const type =
            normalize(
                obj.type ||
                obj.objectType ||
                obj.kind ||
                obj.contentType
            );


        const isPlayer =
            id &&
            name &&
            (
                type.includes("athlete") ||
                type.includes("player") ||
                obj.position ||
                obj.headshot ||
                obj.jersey ||
                obj.team
            );


        if(isPlayer){

            const player = {

                id:String(id),

                name:String(name),

                position:
                    obj.position?.displayName ||
                    obj.position?.name ||
                    "",

                team:
                    obj.team?.displayName ||
                    obj.team?.name ||
                    "",

                nationality:
                    obj.nationality?.displayName ||
                    obj.nationality?.name ||
                    "",

                image:
                    obj.headshot?.href ||
                    obj.image?.href ||
                    obj.photo?.href ||
                    ""

            };


            if(
                !players.some(
                    p => p.id === player.id
                )
            ){

                players.push(player);

            }

        }


        /*
         Search nested objects.
        */

        for(const key of Object.keys(obj)){

            if(
                key === "$ref" ||
                key === "parent"
            ){
                continue;
            }


            const value =
                obj[key];


            if(
                value &&
                typeof value === "object"
            ){

                if(Array.isArray(value)){

                    value.forEach(
                        item => scan(item)
                    );

                }
                else{

                    scan(value);

                }

            }

        }

    }


    scan(data);


    /*
     Rank exact/partial name matches first.
    */

    const nq =
        normalize(query);


    players.sort(
        (a,b) => {

            const an =
                normalize(a.name);

            const bn =
                normalize(b.name);


            const aExact =
                an === nq;

            const bExact =
                bn === nq;


            if(aExact && !bExact){
                return -1;
            }

            if(bExact && !aExact){
                return 1;
            }


            const aStarts =
                an.startsWith(nq);

            const bStarts =
                bn.startsWith(nq);


            if(aStarts && !bStarts){
                return -1;
            }

            if(bStarts && !aStarts){
                return 1;
            }


            return 0;

        }
    );


    return players.slice(0,20);

}


/* =====================================================
   FALLBACK PLAYER SEARCH
===================================================== */

async function fallbackPlayerSearch(query){

    /*
     Search the major soccer league athlete
     databases if global search doesn't respond.

     This is intentionally limited to major
     leagues so the browser isn't downloading
     thousands of unnecessary records.
    */

    const leagues = [

        "eng.1",
        "esp.1",
        "ger.1",
        "ita.1",
        "fra.1",
        "uefa.champions"

    ];


    const results = [];


    for(const league of leagues){

        try{

            const url =
                `https://sports.core.api.espn.com/v3/sports/soccer/${league}/athletes?limit=1000&active=true`;


            const data =
                await getJSON(url);


            const athletes =
                data.items ||
                data.athletes ||
                [];


            const nq =
                normalize(query);


            for(const a of athletes){

                const name =
                    a.displayName ||
                    a.fullName ||
                    a.name ||
                    "";


                if(
                    normalize(name)
                        .includes(nq)
                ){

                    const id =
                        a.id;


                    if(
                        id &&
                        !results.some(
                            p => p.id === String(id)
                        )
                    ){

                        results.push({

                            id:String(id),

                            name:name,

                            position:
                                a.position?.displayName ||
                                a.position?.name ||
                                "",

                            team:
                                a.team?.displayName ||
                                a.team?.name ||
                                "",

                            nationality:
                                a.nationality?.displayName ||
                                a.nationality?.name ||
                                "",

                            image:
                                a.headshot?.href ||
                                a.image?.href ||
                                ""

                        });

                    }

                }

            }

        }
        catch(error){

            console.log(
                "League search failed:",
                league
            );

        }


        /*
         Stop once we have enough results.
        */

        if(results.length >= 20){

            break;

        }

    }


    return results.slice(0,20);

}


/* =====================================================
   KNOWN PLAYER FALLBACK
===================================================== */

function knownPlayerFallback(query){

    const q =
        normalize(query);


    /*
     These are only emergency fallbacks.
     The normal search does NOT depend on this list.
    */

    const known = [

        {
            id:"231388",
            name:"Kylian Mbappé",
            position:"Forward",
            team:"Real Madrid",
            nationality:"France"
        },

        {
            id:"45843",
            name:"Lionel Messi",
            position:"Forward",
            team:"Inter Miami",
            nationality:"Argentina"
        },

        {
            id:"125088",
            name:"Cristiano Ronaldo",
            position:"Forward",
            team:"Al Nassr",
            nationality:"Portugal"
        },

        {
            id:"239432",
            name:"Erling Haaland",
            position:"Forward",
            team:"Manchester City",
            nationality:"Norway"
        },

        {
            id:"239263",
            name:"Jude Bellingham",
            position:"Midfielder",
            team:"Real Madrid",
            nationality:"England"
        }

    ];


    return known.filter(
        player =>
            normalize(player.name)
                .includes(q) ||
            q.includes(
                normalize(player.name)
            )
    );

}


/* =====================================================
   RENDER SEARCH RESULTS
===================================================== */

function renderPlayers(players){

    const results =
        document.getElementById("results");


    results.innerHTML =
        players.map(
            player => {

                const image =
                    player.image ||
                    `https://a.espncdn.com/i/headshots/soccer/players/full/${player.id}.png`;


                const details =
                    [
                        player.team,
                        player.position,
                        player.nationality
                    ]
                    .filter(Boolean)
                    .join(" • ");


                return `

                    <div
                        class="player-result"
                        onclick="openPlayer('${escapeHTML(player.id)}')"
                    >

                        <img
                            class="player-photo"
                            src="${escapeHTML(image)}"
                            alt=""
                            onerror="
                                this.onerror=null;
                                this.style.visibility='hidden';
                            "
                        >


                        <div class="player-info">

                            <h3>
                                ${escapeHTML(player.name)}
                            </h3>

                            <p>
                                ${escapeHTML(
                                    details ||
                                    "Football Player"
                                )}
                            </p>

                        </div>


                        <div class="arrow">
                            →
                        </div>

                    </div>

                `;

            }
        )
        .join("");

}


/* =====================================================
   OPEN PLAYER
===================================================== */

async function openPlayer(id){

    document
        .getElementById("searchPage")
        .style.display = "none";


    document
        .getElementById("profile")
        .style.display = "block";


    const content =
        document.getElementById(
            "profileContent"
        );


    content.innerHTML = `
        <div class="loading">
            Loading player profile...
        </div>
    `;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });


    try{

        const player =
            await getPlayerProfile(id);


        if(!player){

            throw new Error(
                "Profile unavailable"
            );

        }


        /*
         Load available statistics.
        */

        await loadStatistics(
            player
        );


        renderProfile(
            player
        );

    }
    catch(error){

        console.error(error);


        content.innerHTML = `
            <div class="error">

                Player found, but the detailed
                ESPN profile could not be loaded.

                <br><br>

                Please try again.

            </div>
        `;

    }

}


/* =====================================================
   PLAYER PROFILE
===================================================== */

async function getPlayerProfile(id){

    /*
     ESPN soccer athlete profiles normally require
     a league in the URL.

     Try the major leagues.
    */

    const leagues = [

        "esp.1",
        "eng.1",
        "fra.1",
        "ger.1",
        "ita.1",
        "uefa.champions"

    ];


    for(const league of leagues){

        const urls = [

            `${ESPN_CORE}/leagues/${league}/athletes/${id}`,

            `https://sports.core.api.espn.com/v3/sports/soccer/${league}/athletes/${id}`

        ];


        for(const url of urls){

            try{

                const data =
                    await getJSON(url);


                if(data){

                    return extractPlayer(
                        data,
                        id,
                        league
                    );

                }

            }
            catch(error){

                console.log(
                    "Profile endpoint failed:",
                    url
                );

            }

        }

    }


    return null;

}


/* =====================================================
   EXTRACT PROFILE
===================================================== */

function extractPlayer(
    data,
    id,
    league
){

    const a =
        data.athlete ||
        data;


    return {

        id:id,

        league:league,

        name:
            a.displayName ||
            a.fullName ||
            a.name ||
            "Unknown Player",

        firstName:
            a.firstName ||
            "",

        lastName:
            a.lastName ||
            "",

        position:
            a.position?.displayName ||
            a.position?.name ||
            a.position?.abbreviation ||
            "N/A",

        team:
            a.team?.displayName ||
            a.team?.name ||
            "N/A",

        nationality:
            a.nationality?.displayName ||
            a.nationality?.name ||
            a.birthPlace?.country ||
            "N/A",

        birthDate:
            a.dateOfBirth ||
            "N/A",

        age:
            a.age ||
            "N/A",

        jersey:
            a.jersey ||
            "N/A",

        height:
            a.displayHeight ||
            a.height ||
            "N/A",

        weight:
            a.displayWeight ||
            a.weight ||
            "N/A",

        image:
            a.headshot?.href ||
            a.image?.href ||
            `https://a.espncdn.com/i/headshots/soccer/players/full/${id}.png`,

        raw:a,

        statistics:{},

        careerHistory:[]

    };

}


/* =====================================================
   LOAD STATISTICS
===================================================== */

async function loadStatistics(player){

    const league =
        player.league;


    const urls = [

        `${ESPN_CORE}/leagues/${league}/athletes/${player.id}/statistics`,

        `${ESPN_CORE}/leagues/${league}/athletes/${player.id}/statisticslog?limit=100`

    ];


    for(const url of urls){

        try{

            const data =
                await getJSON(url);


            collectStats(
                data,
                player
            );

        }
        catch(error){

            console.log(
                "Stats unavailable:",
                url
            );

        }

    }


    /*
     Also attempt the enriched V3 statistics log.
    */

    try{

        const url =
            `https://sports.core.api.espn.com/v3/sports/soccer/${league}/athletes/${player.id}/statisticslog?limit=100`;


        const data =
            await getJSON(url);


        collectStats(
            data,
            player
        );

    }
    catch(error){

        console.log(
            "V3 statistics log unavailable"
        );

    }

}


/* =====================================================
   COLLECT STATS
===================================================== */

function collectStats(
    data,
    player
){

    function walk(obj){

        if(
            !obj ||
            typeof obj !== "object"
        ){

            return;

        }


        /*
         ESPN can represent a statistic as:
         {name, value, displayValue}
        */

        if(
            obj.name &&
            (
                obj.value !== undefined ||
                obj.displayValue !== undefined
            )
        ){

            const value =
                obj.displayValue ??
                obj.value;


            player.statistics[
                String(obj.name)
            ] =
                value;

        }


        for(const key of Object.keys(obj)){

            if(
                key === "$ref"
            ){

                continue;

            }


            const value =
                obj[key];


            if(
                value &&
                typeof value === "object"
            ){

                walk(value);

            }

        }

    }


    walk(data);

}


/* =====================================================
   FIND STAT
===================================================== */

function findStat(
    player,
    possibleNames
){

    const stats =
        player.statistics;


    for(
        const name of possibleNames
    ){

        if(
            stats[name] !== undefined
        ){

            return stats[name];

        }

    }


    const keys =
        Object.keys(stats);


    for(
        const wanted of possibleNames
    ){

        const w =
            normalize(wanted);


        const found =
            keys.find(
                key =>
                    normalize(key)
                        .includes(w)
            );


        if(found){

            return stats[found];

        }

    }


    return "N/A";

}

                "gamesPlayed",
                "games"
            ]
        );


    const starts =
        findStat(
            player,
            [
                "starts",
                "gamesStarted"
            ]
        );


    const minutes =
        findStat(
            player,
            [
                "minutes",
                "mins"
            ]
        );


    const goals =
        findStat(
            player,
            [
                "goals",
                "totalGoals"
            ]
        );


    const assists =
        findStat(
            player,
            [
                "assists",
                "totalAssists"
            ]
        );


    const shots =
        findStat(

            [

                "totalShots"
            ]
        );


    const shotsTarget =
        findStat(
            player,
            [
                "shotsOnTarget",
                "shotsOnGoal"
            ]
        );


    const yellow =
        findStat(
            player,
            [
                "yellowCards",
                "yellowCard"

        findStat(
            player,
            [

                "redCard"

        );

        <div class="profile-header">

            <img

                <h1 class="profile-name">

            </div>

        </div>



        <!-- PLAYER INFORMATION -->

        <div class="section">

            <h2>
                Player Information
            </h2>


            <div class="info-grid">

                ${infoBox(
                    "Full Name",
                    player.name
                )}

                ${infoBox(
                    "Position",
                    player.position
                )}

                ${infoBox(
                    "Club",
                    player.team
                )}

                ${infoBox(
                    "Nationality",
                    player.nationality
                )}

                ${infoBox(
                    "Date of Birth",
                    formatDate(
                        player.birthDate
                    )
                )}

                ${infoBox(
                    "Age",
                    player.age
                )}

                ${infoBox(
                    "Shirt Number",
                    player.jersey
                )}

                ${infoBox(
                    "Height",
                    player.height
                )}

                ${infoBox(
                    "Weight",
                    player.weight
                )}

            </div>

        </div>



        <!-- CAREER STATISTICS -->

        <div class="section">

            <h2>
                Career Statistics Available
            </h2>


            <div class="stats-grid">

                ${statCard(
                    "Appearances",
                    appearances
                )}

                ${statCard(
                    "Starts",
                    starts
                )}

                ${statCard(
                    "Minutes",
                    minutes
                )}

                ${statCard(
                    "Goals",
                    goals
                )}

                ${statCard(
                    "Assists",
                    assists
                )}

                ${statCard(
                    "Shots",
                    shots
                )}

                ${statCard(
                    "Shots on Target",
                    shotsTarget
                )}

                ${statCard(
                    "Yellow Cards",
                    yellow
                )}

                ${statCard(
                    "Red Cards",
                    red
                )}

            </div>

        </div>



        <!-- ALL STATS -->

        <div class="section">

            <h2>
                All Available Statistics
            </h2>

            <p class="small-note">
                These are the statistics returned by ESPN
                for this player through its soccer API.
            </p>


            ${renderAllStats(player)}

        </div>



        <!-- RATINGS -->

        <div class="section">

            <h2>
                Match Ratings
            </h2>

                soccer match. A rating is shown only when
                the underlying data provides one.
            </p>


            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Date
                            </th>

                            <th>
                                Competition
                            </th>

                            <th>
                                Opponent
                            </th>

                            <th>
                                Minutes
                            </th>

                            <th>
                                Goals
                            </th>

                            <th>
                                Assists
                            </th>

                            <th>
                                Rating

/* =====================================================
   INFO BOX
===================================================== */

function infoBox(
    label,
    value
){

    return `

        <div class="info">

            <strong>
                ${escapeHTML(label)}
            </strong>

            <span>
                ${escapeHTML(
                    value || "N/A"
                )}
            </span>

        </div>

    `;

}


/* =====================================================
   STAT CARD
===================================================== */

function statCard(
    label,
    value
){

    return `

        <div class="stat">

            <div class="stat-label">
                ${escapeHTML(label)}
            </div>

            <div class="stat-value">
                ${escapeHTML(
                    value ?? "N/A"
                )}
            </div>

        </div>

    `;

}


/* =====================================================
   ALL STATISTICS TABLE
===================================================== */

function renderAllStats(player){

    const stats =
        player.statistics;


    const keys =
        Object.keys(stats);


    if(!keys.length){

        return `
            <div class="status">
                No detailed statistics were returned
                by ESPN for this player.
            </div>
        `;

    }


    return `

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>
                            Statistic
                        </th>

                        <th>
                            Value
                        </th>

                    </tr>

                </thead>


                <tbody>

                    ${keys.map(
                        key => `

                            <tr>

                                <td>
                                    ${escapeHTML(
                                        prettyName(key)
                                    )}
                                </td>

                                <td>
                                    ${escapeHTML(
                                        stats[key]
                                    )}
                                </td>

                            </tr>

                        `
                    ).join("")}

                </tbody>

            </table>

        </div>

    `;

}


/* =====================================================
   PRETTY STAT NAME
===================================================== */

function prettyName(name){

    return String(name)
        .replace(
            /([a-z])([A-Z])/g,
            "$1 $2"
        )
        .replace(
            /_/g,
            " "
        )
        .replace(
            /\b\w/g,
            c => c.toUpperCase()
        );

}


/* =====================================================
   DATE
===================================================== */

function formatDate(date){

    if(
        !date ||
        date === "N/A"
    ){

        return "N/A";

    }


    const d =
        new Date(date);


    if(
        Number.isNaN(
            d.getTime()
        )
    ){

        return date;

    }


    return d.toLocaleDateString(
        "en-GB",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}
