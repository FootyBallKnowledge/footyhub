<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FootyHub | Players</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#07111f;
    color:#fff;
    min-height:100vh;
}

header{
    background:#0b1728;
    border-bottom:1px solid #243850;
    position:sticky;
    top:0;
    z-index:100;
}

.nav{
    max-width:1250px;
    margin:auto;
    padding:16px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:27px;
    font-weight:800;
    color:#35df8b;
}

.logo span{
    color:white;
}

.home{
    text-decoration:none;
    color:white;
    background:#14263d;
    border:1px solid #2b4562;
    padding:10px 18px;
    border-radius:8px;
}

.home:hover{
    background:#1c3653;
}

.container{
    width:min(1200px,94%);
    margin:auto;
}

/* HERO */

.hero{
    text-align:center;
    padding:55px 15px 30px;
}

.hero h1{
    font-size:42px;
    margin-bottom:12px;
}

.hero p{
    color:#91a5bb;
    font-size:16px;
}

/* SEARCH */

.search-area{
    max-width:800px;
    margin:10px auto 35px;
}

.search-box{
    display:flex;
    background:#101f32;
    border:1px solid #2b4562;
    border-radius:12px;
    overflow:hidden;
}

.search-box input{
    flex:1;
    min-width:0;
    padding:18px 20px;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    font-size:17px;
}

.search-box input::placeholder{
    color:#71869d;
}

.search-box button{
    border:0;
    background:#35df8b;
    color:#06140d;
    font-weight:bold;
    padding:0 27px;
    cursor:pointer;
    font-size:15px;
}

.search-box button:hover{
    background:#5beaa3;
}

.search-hint{
    color:#71869d;
    font-size:13px;
    margin-top:10px;
    text-align:center;
}

/* RESULTS */

#results{
    padding-bottom:50px;
}

.results-title{
    color:#8ea3b8;
    margin-bottom:15px;
}

.player-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:14px;
}

.player-card{
    background:#0f1e30;
    border:1px solid #263d57;
    border-radius:13px;
    padding:17px;
    display:flex;
    align-items:center;
    gap:15px;
    cursor:pointer;
    transition:.2s;
}

.player-card:hover{
    border-color:#35df8b;
    transform:translateY(-3px);
    background:#142840;
}

.player-image{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:50%;
    background:#172a40;
}

.player-card-info{
    min-width:0;
    flex:1;
}

.player-card-info h3{
    font-size:17px;
    margin-bottom:7px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-card-info p{
    color:#8da2b7;
    font-size:13px;
    line-height:1.5;
}

.arrow{
    color:#35df8b;
    font-size:23px;
}

/* PROFILE */

#profile{
    display:none;
    padding:35px 0 60px;
}

.back{
    border:1px solid #2b4562;
    background:#14263d;
    color:white;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:22px;
}

.back:hover{
    background:#1d3855;
}

.profile-head{
    background:linear-gradient(135deg,#10253d,#0b1728);
    border:1px solid #29435f;
    border-radius:18px;
    padding:30px;
    display:flex;
    gap:30px;
    align-items:center;
    margin-bottom:22px;
}

.profile-image{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    background:#172b42;
}

.profile-name{
    font-size:38px;
    margin-bottom:10px;
}

.profile-sub{
    color:#9db0c3;
    line-height:1.8;
}

.position{
    display:inline-block;
    background:#153d2e;
    color:#54e39d;
    padding:5px 11px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:7px;
}

/* SECTIONS */

.section{
    background:#0d1b2c;
    border:1px solid #253b54;
    border-radius:15px;
    padding:24px;
    margin-bottom:20px;
}

.section h2{
    font-size:22px;
    margin-bottom:18px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:12px;
}

.info{
    background:#13263d;
    padding:15px;
    border-radius:10px;
}

.info label{
    display:block;
    color:#8096ad;
    font-size:12px;
    margin-bottom:7px;
}

.info strong{
    font-size:15px;
}

/* STATS */

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
    gap:12px;
}

.stat{
    background:#13263d;
    border:1px solid #29425d;
    padding:17px;
    border-radius:10px;
}

.stat-name{
    color:#8298ae;
    font-size:12px;
    margin-bottom:8px;
}

.stat-value{
    color:#35df8b;
    font-size:24px;
    font-weight:bold;
}

/* CAREER */

.career{
    display:grid;
    grid-template-columns:140px 1fr 120px;
    gap:15px;
    align-items:center;
    background:#13263d;
    border-radius:10px;
    padding:15px;
    margin-bottom:10px;
}

.career-year{
    color:#35df8b;
    font-weight:bold;
}

.career-club{
    font-weight:bold;
}

.career-competition{
    color:#879cb1;
    font-size:13px;
}

/* TABLE */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:13px 12px;
    border-bottom:1px solid #253a52;
    text-align:left;
    white-space:nowrap;
}

th{
    color:#8298ae;
    font-size:12px;
    background:#122238;
}

td{
    font-size:14px;
}

.rating{
    color:#35df8b;
    font-weight:bold;
}

.note{
    color:#8196ac;
    font-size:13px;
    line-height:1.7;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:45px 20px;
    color:#8196ac;
    background:#0e1d2e;
    border:1px solid #243b55;
    border-radius:13px;
}

.empty strong{
    color:white;
}

/* LOADING */

.loading{
    text-align:center;
    padding:40px;
    color:#8398ae;
}

/* MOBILE */

@media(max-width:700px){

    .hero h1{
        font-size:31px;
    }

    .search-box button{
        padding:0 16px;
    }

    .profile-head{
        flex-direction:column;
        text-align:center;
    }

    .profile-name{
        font-size:29px;
    }

    .profile-image{
        width:125px;
        height:125px;
    }

    .career{
        grid-template-columns:1fr;
        gap:5px;
    }
}
</style>
</head>

<header>

            Bellingham, Yamal or Salah.

</section>


<!-- ================= PROFILE ================= -->

<section id="profile">

    <button
        class="back"
        onclick="showSearch()"
    >
        ← Back to Players
    </button>

    <div id="profileContent"></div>

</section>

</main>

/* =========================================================
   NORMALIZE SEARCH
   ========================================================= */

function normalize(text){

    return String(text || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .trim();

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   SEARCH
   ========================================================= */

function searchPlayers(){

    const input =
        document.getElementById("playerSearch");

    const query =
        normalize(input.value);


    const results =
        document.getElementById("results");


    if(!query){

        results.innerHTML = `

            <div class="empty">

                <strong>Search for a player</strong>

                <br><br>

                Type a player's name above.

            </div>

        `;

        return;

    }


    const matches =
        players.filter(player => {

            const name =
                normalize(player.name);

            const aliases =
                player.aliases
                .map(normalize);


            return (
                name.includes(query) ||
                aliases.some(
                    alias =>
                    alias.includes(query) ||
                    query.includes(alias)
                )
            );

        });


    /*
       Sort exact matches first,
       then names beginning with query.
    */

    matches.sort((a,b)=>{

        const an =
            normalize(a.name);

        const bn =
            normalize(b.name);


        if(an === query && bn !== query)
            return -1;

        if(bn === query && an !== query)
            return 1;


        if(an.startsWith(query) &&
           !bn.startsWith(query))
            return -1;

        if(bn.startsWith(query) &&
           !an.startsWith(query))
            return 1;


        return an.localeCompare(bn);

    });


    if(!matches.length){

        results.innerHTML = `

            <div class="empty">

                No player found for
                <strong>${escapeHTML(input.value)}</strong>.

                <br><br>

                Try another spelling or surname.

            </div>

        `;

        return;

    }


    results.innerHTML = `

        <div class="results-title">

            ${matches.length}
            player${matches.length === 1 ? "" : "s"}
            found

        </div>


        <div class="player-grid">

            ${matches.map(
                player => playerCard(player)
            ).join("")}

        </div>

    `;

}


/* =========================================================
   PLAYER CARD
   ========================================================= */

function playerCard(player){

    return `

        <div
            class="player-card"
            onclick="openPlayer('${player.id}')"
        >

            <img
                class="player-image"
                src="${player.image}"
                alt=""
                onerror="
                    this.onerror=null;
                    this.src='https://a.espncdn.com/i/headshots/soccer/players/full/${player.id}.png';
                "
            >


            <div class="player-card-info">

                <h3>
                    ${escapeHTML(player.name)}
                </h3>

                <p>
                    ${escapeHTML(player.club)}
                    <br>
                    ${escapeHTML(player.position)}
                    •
                    ${escapeHTML(player.country)}
                </p>

            </div>


            <div class="arrow">
                →
            </div>

        </div>

    `;

}


/* =========================================================
   OPEN PLAYER
   ========================================================= */

function openPlayer(id){

    const player =
        players.find(
            p => String(p.id) === String(id)
        );


    if(!player)
        return;


    document
        .getElementById("searchPage")
        .style.display="none";


    document
        .getElementById("profile")
        .style.display="block";


    document
        .getElementById("profileContent")
        .innerHTML =
        buildProfile(player);


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

                            <th>Opponent</th>
                            <th>Minutes</th>

                            <th>Assists</th>
                            <th>Rating</th>

                    </thead>

                    <tbody>

                        <tr>

                            <td colspan="7"

                    </tbody>

        </div>

    `;

}


/* =========================================================

   ========================================================= */

function info(label,value){

    return `

        <div class="info">

            <label>
                ${escapeHTML(label)}

            <strong>

            </strong>

        </div>

    `;

}

document
    .getElementById("playerSearch")

        "input",
        function(){

            if(this.value.trim().length >= 2){

        }
