.results {

}

.player-card {

.hidden {

}

    background: #1c3049;
}

.profile-top h2 {

}

.profile-top p {
    color: #aebbd0;

.section {

table {

th, td {

th {

/* =========================================================
   SEARCH
   ========================================================= */

const input = document.getElementById("searchInput");
const results = document.getElementById("results");
const message = document.getElementById("message");
const profile = document.getElementById("profile");

function normalize(text) {
    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9 ]/g, "")
        .trim();
}

function searchPlayers() {

    const query = normalize(input.value);

    results.innerHTML = "";
    profile.classList.add("hidden");
    profile.innerHTML = "";

    if (!query) {
        message.textContent = "Start typing a player's name.";
        return;
    }

    const matches = players.filter(player => {

        const name = normalize(player.name);

        const aliases = player.aliases
            .map(alias => normalize(alias));

        return (
            name.includes(query) ||
            query.includes(name) ||
            aliases.some(alias =>
                alias.includes(query) ||
                query.includes(alias)
            )
        );
    });

    if (matches.length === 0) {
        message.textContent =
            "No player found. Try another spelling or search term.";
        return;
    }

    message.textContent =
        matches.length + " player" +
        (matches.length > 1 ? "s" : "") +
        " found.";

    matches.forEach(player => {

        const card = document.createElement("div");

        card.className = "player-card";

        card.innerHTML = `
            <img
                src="${player.image}"
                alt="${player.name}"
                onerror="this.style.display='none'"
            >

            <h3>${player.name}</h3>

            <p>${player.position}</p>

            <p>${player.currentClub}</p>

            <p>${player.country}</p>
        `;

        card.addEventListener("click", () => {
            showProfile(player);
        });

        results.appendChild(card);
    });
}


/* =========================================================
   PLAYER PROFILE
   ========================================================= */

    results.innerHTML = "";
    message.textContent = "";

    profile.classList.remove("hidden");

    let clubsHTML = "";

    player.clubs.forEach(club => {

        clubsHTML += `
            <tr>
                <td>${club[0]}</td>
                <td>${club[1]}</td>
            </tr>
        `;
    });

    let seasonsHTML = "";

    player.seasons.forEach(season => {

        seasonsHTML += `
            <tr>
                <td>${season[0]}</td>
                <td>${season[1]}</td>
                <td>${season[2]}</td>
                <td>${season[3]}</td>
                <td>${season[4]}</td>
                <td>${season[5]}</td>
            </tr>
        `;
    });

    profile.innerHTML = `

        <div class="profile-top">

            <img
                src="${player.image}"
                alt="${player.name}"
                onerror="this.style.display='none'"
            >

            <div>

                <h2>${player.name}</h2>

                <p><strong>${player.position}</strong></p>

                <p>${player.currentClub}</p>

                <p>${player.country}</p>

            </div>

        </div>


        <div class="section">

            <h3>Player Information</h3>

            <div class="info-grid">

                <div class="info-box">
                    <strong>Nationality</strong>
                    ${player.country}
                </div>

                <div class="info-box">
                    <strong>Position</strong>
                    ${player.position}
                </div>

                <div class="info-box">
                    <strong>Date of Birth</strong>
                    ${player.birth}
                </div>

                <div class="info-box">
                    <strong>Current Club</strong>
                    ${player.currentClub}
                </div>

                <div class="info-box">
                    <strong>Squad Number</strong>
                    ${player.number}
                </div>

            </div>

        </div>


        <div class="section">

            <h3>Career Statistics</h3>

            <div class="info-grid">

                <div class="info-box">
                    <strong>Appearances</strong>
                    ${player.career.appearances}
                </div>

                <div class="info-box">
                    <strong>Goals</strong>
                    ${player.career.goals}
                </div>

                <div class="info-box">
                    <strong>Assists</strong>
                    ${player.career.assists}
                </div>

                <div class="info-box">
                    <strong>International Goals</strong>
                    ${player.career.internationalGoals}
                </div>

                <div class="info-box">
                    <strong>Trophies</strong>
                    ${player.career.trophies}
                </div>

            </div>

        </div>


        <div class="section">

            <h3>Club Career</h3>

            <table>

                <thead>
                    <tr>
                        <th>Club</th>
                        <th>Years</th>
                    </tr>
                </thead>

                <tbody>
                    ${clubsHTML}
                </tbody>

            </table>

        </div>


        <div class="section">

            <h3>Season Statistics</h3>

            <table>

                <thead>

                    <tr>
                        <th>Season</th>
                        <th>Club</th>
                        <th>League</th>
                        <th>Apps</th>
                        <th>Goals</th>
                        <th>Assists</th>
                    </tr>

                </thead>

                <tbody>
                    ${seasonsHTML}
                </tbody>

            </table>

        </div>


        <div class="section">

            <h3>Match Statistics & Ratings</h3>

            <div class="info-box">

                Detailed individual match statistics and ratings will
                appear here when a verified match-statistics data source
                is connected.

            </div>

        </div>


        <button class="back" onclick="backToSearch()">
            ← Back to Search
        </button>
    `;
}


/* =========================================================
   BACK BUTTON
   ========================================================= */

function backToSearch() {

    profile.classList.add("hidden");

    results.innerHTML = "";

    input.focus();

    if (input.value.trim()) {
        searchPlayers();
    } else {
        message.textContent = "Start typing a player's name.";
    }
}


/* =========================================================
   EVENTS
   ========================================================= */

input.addEventListener("input", searchPlayers);

document
    .getElementById("searchButton")
    .addEventListener("click", searchPlayers);

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        searchPlayers();
    }

});

console.log("FootyHub Players loaded:", players.length, "players.");

</script>
