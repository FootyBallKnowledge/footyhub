header{

}

.container{

}

.search-area h2{

}

.search-row{

#searchButton:hover{

#message{

.results{

.player-card{

.player-card:hover{

}

.player-photo{

.player-card h3{

}

.player-card p{

    color:#9fb0c4;

}

.profile{
    margin-top:25px;
    background:#101d2d;

    padding:28px;
}

.profile-header{
    display:flex;

}

.profile-photo{
    width:150px;
    height:150px;

    border-radius:50%;
    background:#1d344e;
}

.profile-header h2{
    margin:0 0 10px;
    font-size:34px;
}

.profile-header p{
    color:#a9b9cb;
    margin:6px 0;
}

.section{
    margin-top:30px;
}

.section h3{
    border-left:4px solid #1687ed;
    padding-left:10px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:12px;

.info-box{

    padding:16px;

}

.info-box span{

    color:#8195aa;
    font-size:13px;
    margin-bottom:6px;

table{

th,td{

    text-align:left;
    border-bottom:1px solid #29415d;

th{

td{

.back-button{

.back-button:hover{

.hidden{

/* =========================================================
   SEARCH NORMALIZER
   ========================================================= */

function normalize(text){

    return String(text)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/[^a-z0-9]/g,"");

}


/* =========================================================
   SEARCH FUNCTION
   ========================================================= */

function searchPlayers(){

    const input = document.getElementById("searchInput");

    const query = normalize(input.value);

    const results = document.getElementById("results");

    const message = document.getElementById("message");

    const profile = document.getElementById("profile");

    profile.classList.add("hidden");

    profile.innerHTML = "";

    results.innerHTML = "";

    if(query === ""){

        message.textContent =
            "Type a player's name to search.";

        return;

    }


    const matches = players.filter(player => {

        const mainName = normalize(player.name);

        if(mainName.includes(query)){
            return true;
        }

        return player.aliases.some(alias =>
            normalize(alias).includes(query)
        );

    });


    if(matches.length === 0){

        message.innerHTML =
            "<strong>No player found.</strong> Try Mbappe, Messi, Ronaldo, Haaland, Salah or Bellingham.";

        return;

    }


    message.textContent =
        matches.length +
        (matches.length === 1 ? " player found." : " players found.");


    matches.forEach(player => {

        const card = document.createElement("div");

        card.className = "player-card";

        card.innerHTML = `

            <img
                class="player-photo"
                src="${player.image}"
                alt="${player.name}"
                onerror="this.onerror=null;this.src='https://placehold.co/200x200/1d344e/ffffff?text=⚽';"
            >

            <h3>${player.name}</h3>

            <p>${player.position}</p>

            <p>${player.club}</p>

            <p>${player.country}</p>

        `;

        card.onclick = function(){

            showProfile(player);

        };

        results.appendChild(card);

    });

}


/* =========================================================
   SHOW PLAYER PROFILE
   ========================================================= */

function showProfile(player){

    const results = document.getElementById("results");

    const message = document.getElementById("message");

    const profile = document.getElementById("profile");

    results.innerHTML = "";

    message.textContent = "";

    profile.classList.remove("hidden");


    let careerHTML = "";

    player.career.forEach(stat => {

        careerHTML += `

            <div class="info-box">

                <span>${stat[0]}</span>

                <strong>${stat[1]}</strong>

            </div>

        `;

    });


    let clubsHTML = "";

    player.clubs.forEach(club => {

        clubsHTML += `

            <tr>

                <td>${club[0]}</td>

                <td>${club[1]}</td>

            </tr>

        `;

    });


    let seasonsHTML = "";

    player.seasons.forEach(season => {

        seasonsHTML += `

            <tr>

                <td>${season[0]}</td>
                <td>${season[1]}</td>
                <td>${season[2]}</td>
                <td>${season[3]}</td>
                <td>${season[4]}</td>
                <td>${season[5]}</td>

            </tr>

        `;

    });


    profile.innerHTML = `

        <div class="profile-header">

            <img
                class="profile-photo"
                src="${player.image}"
                alt="${player.name}"
                onerror="this.onerror=null;this.src='https://placehold.co/200x200/1d344e/ffffff?text=⚽';"
            >

            <div>

                <h2>${player.name}</h2>

                <p><strong>${player.position}</strong></p>

                <p>${player.club}</p>

                <p>${player.country}</p>

            </div>

        </div>


        <div class="section">

            <h3>Player Information</h3>

            <div class="info-grid">

                <div class="info-box">
                    <span>Nationality</span>
                    <strong>${player.country}</strong>
                </div>

                <div class="info-box">
                    <span>Position</span>
                    <strong>${player.position}</strong>
                </div>

                <div class="info-box">
                    <span>Date of Birth</span>
                    <strong>${player.birth}</strong>
                </div>

                <div class="info-box">
                    <span>Current Club</span>
                    <strong>${player.club}</strong>
                </div>

                <div class="info-box">
                    <span>Squad Number</span>
                    <strong>${player.number}</strong>
                </div>

            </div>

        </div>


        <div class="section">

            <h3>Career Statistics</h3>

            <div class="info-grid">

                ${careerHTML}

            </div>

        </div>


        <div class="section">

            <h3>Club History</h3>

            <table>

                <thead>

                    <tr>
                        <th>Club</th>
                        <th>Years</th>
                    </tr>

                </thead>

                <tbody>

                    ${clubsHTML}

                </tbody>

            </table>

        </div>


        <div class="section">

            <h3>Season Statistics</h3>

            <table>

                <thead>

                    <tr>
                        <th>Season</th>
                        <th>Club</th>
                        <th>League</th>
                        <th>Apps</th>
                        <th>Goals</th>
                        <th>Assists</th>
                    </tr>

                </thead>

                <tbody>

                    ${seasonsHTML}

                </tbody>

            </table>

        </div>


        <div class="section">

            <h3>Match Statistics & Ratings</h3>

            <div class="info-box">

                Match-by-match ratings are not included in this
                static database yet. No invented ratings are shown.

            </div>

        </div>


        <button
            class="back-button"
            onclick="backToSearch()"
        >
            ← Back to Search
        </button>

    `;

}


/* =========================================================
   BACK TO SEARCH
   ========================================================= */

function backToSearch(){

    const profile = document.getElementById("profile");

    const input = document.getElementById("searchInput");

    profile.classList.add("hidden");

    profile.innerHTML = "";

    if(input.value.trim() !== ""){

        searchPlayers();

    }else{

        document.getElementById("message").textContent =
            "Type a player's name to search.";

    }

}


/* =========================================================
   BUTTON
   ========================================================= */

document
    .getElementById("searchButton")
    .addEventListener("click",searchPlayers);


/* =========================================================
   LIVE SEARCH
   ========================================================= */

document
    .getElementById("searchInput")
    .addEventListener("input",searchPlayers);


/* =========================================================
   ENTER KEY
   ========================================================= */

document
    .getElementById("searchInput")
    .addEventListener("keydown",function(event){

        if(event.key === "Enter"){

            searchPlayers();

        }

    });


/* =========================================================
   PAGE TEST
   ========================================================= */

console.log(
    "FootyHub Players loaded successfully:",
    players.length,
    "players"
);

</script>
