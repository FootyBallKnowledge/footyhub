name: Update Football Data

on:
  workflow_dispatch:

  schedule:
    # Runs every 30 minutes
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-football-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch football data
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timedelta, timezone

          API_KEY = __import__("os").environ["API_KEY"]

          BASE_URL = "https://v3.football.api-sports.io/fixtures"

          # API-Football league IDs
          TOP_LEAGUES = {
              39: "Premier League",
              140: "La Liga",
              78: "Bundesliga",
              135: "Serie A",
              61: "Ligue 1",
              88: "Eredivisie",
              94: "Primeira Liga",
              203: "Süper Lig",
              71: "Brasileirão",
              128: "Argentina Primera"
          }

          # Current date in UTC
          today = datetime.now(timezone.utc).date()

          dates = [
              today - timedelta(days=1),
              today,
              today + timedelta(days=1)
          ]

          all_matches = []

          for match_date in dates:

              url = (
                  f"{BASE_URL}"
                  f"?date={match_date.isoformat()}"
                  f"&timezone=Asia/Kolkata"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": API_KEY
                  }
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      data = json.loads(response.read().decode())

                  fixtures = data.get("response", [])

                  print(
                      f"{match_date}: "
                      f"{len(fixtures)} fixtures received"
                  )

                  for item in fixtures:

                      league = item.get("league", {})
                      league_id = league.get("id")

                      # Keep only our selected leagues
                      if league_id not in TOP_LEAGUES:
                          continue

                      teams = item.get("teams", {})
                      goals = item.get("goals", {})
                      fixture = item.get("fixture", {})

                      home = teams.get("home", {})
                      away = teams.get("away", {})

                      status = fixture.get("status", {})

                      kickoff = fixture.get("date")

                      if kickoff:
                          try:
                              dt = datetime.fromisoformat(
                                  kickoff.replace("Z", "+00:00")
                              )

                              time_string = dt.astimezone(
                                  timezone(timedelta(hours=5, minutes=30))
                              ).strftime("%I:%M %p")

                          except Exception:
                              time_string = "--:--"
                      else:
                          time_string = "--:--"

                      match = {
                          "id": item.get("fixture", {}).get("id"),
                          "date": match_date.isoformat(),

                          "league": TOP_LEAGUES[league_id],

                          "country": league.get(
                              "country",
                              ""
                          ),

                          "home": home.get(
                              "name",
                              "Unknown"
                          ),

                          "away": away.get(
                              "name",
                              "Unknown"
                          ),

                          "homeLogo": home.get(
                              "logo",
                              ""
                          ),

                          "awayLogo": away.get(
                              "logo",
                              ""
                          ),

                          "homeScore": goals.get(
                              "home"
                          ),

                          "awayScore": goals.get(
                              "away"
                          ),

                          "time": time_string,

                          "live": status.get(
                              "short"
                          ) in [
                              "1H",
                              "2H",
                              "HT",
                              "ET",
                              "P",
                              "LIVE"
                          ],

                          "status": status.get(
                              "long",
                              "Scheduled"
                          )
                      }

                      all_matches.append(match)

              except Exception as error:
                  print(
                      f"Error fetching {match_date}: {error}"
                  )

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),

              "matches": all_matches
          }

          with open(
              "football-data.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2,
                  ensure_ascii=False
              )

          print(
              f"Saved {len(all_matches)} matches."
          )
          PY

      - name: Commit updated football data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add football-data.json

          git diff --cached --quiet || git commit -m "Update football data"

          git push
