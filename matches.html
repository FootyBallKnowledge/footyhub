<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FootyHub - Matches</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #17202a;
}

/* HEADER */
header {
    background: #071a2f;
    color: white;
    padding: 18px 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

.logo span {
    color: #22c55e;
}

nav {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 9px 13px;
    border-radius: 6px;
    transition: 0.2s;
}

nav a:hover,
nav a.active {
    background: #22c55e;
    color: #071a2f;
}

/* MAIN */
.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px 18px 50px;
}

.page-title {
    font-size: 32px;
    margin-bottom: 7px;
}

.subtitle {
    color: #68727d;
    margin-bottom: 22px;
}

/* DATE BUTTONS */
.date-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.date-btn {
    border: none;
    background: white;
    padding: 12px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: 0.2s;
}

.date-btn:hover {
    transform: translateY(-1px);
}

.date-btn.active {
    background: #22c55e;
    color: white;
}

/* TOP BAR */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
}

.selected-date {
    font-size: 18px;
    font-weight: bold;
}

.refresh-btn {
    border: none;
    background: #071a2f;
    color: white;
    padding: 10px 17px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.refresh-btn:hover {
    background: #12365d;
}

.refresh-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* LOADING */
.loading {
    text-align: center;
    padding: 50px 20px;
    background: white;
    border-radius: 12px;
}

.spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #ddd;
    border-top: 4px solid #22c55e;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: auto auto 15px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* ERROR */
.error-box {
    background: #fff4f4;
    border: 1px solid #ef4444;
    color: #991b1b;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.error-box strong {
    display: block;
    margin-bottom: 6px;
}

/* LEAGUE */
.league-section {
    margin-bottom: 28px;
}

.league-title {
    background: #071a2f;
    color: white;
    padding: 13px 17px;
    border-radius: 9px 9px 0 0;
    font-size: 17px;
    font-weight: bold;
}

.matches {
    background: white;
    border-radius: 0 0 9px 9px;
    overflow: hidden;
}

/* MATCH */
.match {
    padding: 17px;
    border-bottom: 1px solid #e7e9eb;
}

.match:last-child {
    border-bottom: none;
}

.match-time {
    text-align: center;
    font-size: 13px;
    color: #68727d;
    margin-bottom: 12px;
}

.match-content {
    display: grid;
    grid-template-columns: 1fr 90px 1fr;
    align-items: center;
    gap: 10px;
}

.team {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: bold;
}

.team.home {
    justify-content: flex-end;
    text-align: right;
}

.team.away {
    justify-content: flex-start;
    text-align: left;
}

.team img {
    width: 34px;
    height: 34px;
    object-fit: contain;
}

.score {
    text-align: center;
    font-size: 21px;
    font-weight: bold;
}

.status {
    display: block;
    font-size: 11px;
    margin-top: 4px;
    color: #68727d;
    font-weight: normal;
}

.live {
    color: #dc2626;
    font-weight: bold;
}

/* NO MATCHES */
.no-matches {
    background: white;
    padding: 45px 20px;
    text-align: center;
    border-radius: 12px;
}

.no-matches h3 {
    margin-bottom: 8px;
}

.no-matches p {
    color: #68727d;
}

/* FOOTER */
footer {
    background: #071a2f;
    color: #cbd5e1;
    text-align: center;
    padding: 25px 15px;
    margin-top: 30px;
}

footer p {
    margin: 5px;
}

/* MOBILE */
@media (max-width: 650px) {

    header {
        justify-content: center;
        text-align: center;
    }

    nav {
        justify-content: center;
    }

    .page-title {
        font-size: 27px;
    }

    .match-content {
        grid-template-columns: 1fr 70px 1fr;
    }

    .team {
        font-size: 13px;
    }

    .team img {
        width: 28px;
        height: 28px;
    }

    .score {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        Footy<span>Hub</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="matches.html" class="active">Matches</a>
        <a href="leagues.html">Leagues</a>
        <a href="standings.html">Standings</a>
    </nav>
</header>


<main class="container">

    <h1 class="page-title">Football Matches</h1>

    <p class="subtitle">
        Live, upcoming and completed matches from major football competitions.
    </p>


    <div class="date-buttons">

        <button class="date-btn active" data-day="today">
            Today
        </button>

        <button class="date-btn" data-day="tomorrow">
            Tomorrow
        </button>

        <button class="date-btn" data-day="yesterday">
            Yesterday
        </button>

    </div>


    <div class="top-bar">

        <div class="selected-date" id="selectedDate">
            Loading date...
        </div>

        <button class="refresh-btn" id="refreshBtn">
            ↻ Refresh
        </button>

    </div>


    <div id="message"></div>

    <div id="matchesContainer">

        <div class="loading">
            <div class="spinner"></div>
            <p>Loading football matches...</p>
        </div>

    </div>

</main>


<footer>

    <p><strong>FootyHub</strong></p>

    <p>
        Football statistics, matches, leagues and standings.
    </p>

</footer>


<script>

/* =========================================================
   FOOTYHUB MATCHES
   ========================================================= */


/* ESPN API */
const API =
    "https://site.api.espn.com/apis/site/v2/sports/soccer";


/*
   Major competitions.

   ESPN uses these competition IDs.
*/
const LEAGUES = [

    {
        id: "eng.1",
        name: "Premier League"
    },

    {
        id: "esp.1",
        name: "La Liga"
    },

    {
        id: "ger.1",
        name: "Bundesliga"
    },

    {
        id: "ita.1",
        name: "Serie A"
    },

    {
        id: "fra.1",
        name: "Ligue 1"
    },

    {
        id: "uefa.champions",
        name: "UEFA Champions League"
    },

    {
        id: "uefa.europa",
        name: "UEFA Europa League"
    },

    {
        id: "eng.2",
        name: "Championship"
    },

    {
        id: "ned.1",
        name: "Eredivisie"
    },

    {
        id: "por.1",
        name: "Primeira Liga"
    },

    {
        id: "usa.1",
        name: "MLS"
    },

    {
        id: "mex.1",
        name: "Liga MX"
    }
];


/* Current selected day */
let selectedDay = "today";


/* =========================================================
   DATE FUNCTIONS
   ========================================================= */

function getDate(day) {

    const date = new Date();

    if (day === "tomorrow") {
        date.setDate(date.getDate() + 1);
    }

    if (day === "yesterday") {
        date.setDate(date.getDate() - 1);
    }

    const year = date.getFullYear();

    const month =
        String(date.getMonth() + 1).padStart(2, "0");

    const dayNumber =
        String(date.getDate()).padStart(2, "0");

    return `${year}${month}${dayNumber}`;
}


/* Human readable date */
function getReadableDate(day) {

    const date = new Date();

    if (day === "tomorrow") {
        date.setDate(date.getDate() + 1);
    }

    if (day === "yesterday") {
        date.setDate(date.getDate() - 1);
    }

    return date.toLocaleDateString(
        "en-IN",
        {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );
}


/* =========================================================
   LOAD MATCHES
   ========================================================= */

async function loadMatches() {

    const container =
        document.getElementById("matchesContainer");

    const message =
        document.getElementById("message");

    const refreshBtn =
        document.getElementById("refreshBtn");

    const selectedDate =
        document.getElementById("selectedDate");


    selectedDate.textContent =
        getReadableDate(selectedDay);


    container.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading football matches...</p>
        </div>
    `;

    message.innerHTML = "";

    refreshBtn.disabled = true;


    const date = getDate(selectedDay);


    /*
       Fetch all leagues at the same time.
    */

    const results = await Promise.all(

        LEAGUES.map(async (league) => {

            try {

                const url =
                    `${API}/${league.id}/scoreboard?dates=${date}&limit=100&_=${Date.now()}`;

                const response =
                    await fetch(
                        url,
                        {
                            method: "GET",
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                return {
                    league: league,
                    events: data.events || [],
                    error: null
                };


            } catch (error) {

                console.error(
                    `Failed to load ${league.name}:`,
                    error
                );


                return {
                    league: league,
                    events: [],
                    error: error.message
                };

            }

        })

    );


    refreshBtn.disabled = false;


    renderMatches(results);

}


/* =========================================================
   RENDER MATCHES
   ========================================================= */

function renderMatches(results) {

    const container =
        document.getElementById("matchesContainer");

    const message =
        document.getElementById("message");


    container.innerHTML = "";


    let totalMatches = 0;

    let failedLeagues = 0;


    results.forEach(result => {

        totalMatches += result.events.length;

        if (result.error) {
            failedLeagues++;
        }

    });


    /*
       Show warning if some APIs failed.
    */

    if (failedLeagues > 0) {

        message.innerHTML = `
            <div class="error-box">
                <strong>Some football data could not be loaded.</strong>
                ${failedLeagues} competition API request(s) failed.
                Other available competitions are still being displayed.
            </div>
        `;

    }


    /*
       If absolutely nothing was received.
    */

    if (totalMatches === 0) {

        container.innerHTML = `

            <div class="no-matches">

                <h3>No matches found</h3>

                <p>
                    There are no matches available from the
                    selected competitions for this date,
                    or the football data service is temporarily unavailable.
                </p>

                <br>

                <button
                    class="refresh-btn"
                    onclick="loadMatches()">
                    Try Again
                </button>

            </div>

        `;

        return;

    }


    /*
       Display each league that has matches.
    */

    results.forEach(result => {

        if (!result.events.length) {
            return;
        }


        const section =
            document.createElement("section");

        section.className =
            "league-section";


        section.innerHTML = `

            <div class="league-title">
                ${escapeHTML(result.league.name)}
            </div>

            <div class="matches"></div>

        `;


        const matchesDiv =
            section.querySelector(".matches");


        /*
           Sort matches by start time.
        */

        result.events.sort(
            (a, b) => {

                return new Date(a.date) -
                       new Date(b.date);

            }
        );


        result.events.forEach(event => {

            matchesDiv.appendChild(
                createMatch(event)
            );

        });


        container.appendChild(section);

    });

}


/* =========================================================
   CREATE MATCH CARD
   ========================================================= */

function createMatch(event) {

    const article =
        document.createElement("article");

    article.className = "match";


    const competition =
        event.competitions &&
        event.competitions[0];


    if (!competition) {
        return article;
    }


    const competitors =
        competition.competitors || [];


    const home =
        competitors.find(
            team => team.homeAway === "home"
        );


    const away =
        competitors.find(
            team => team.homeAway === "away"
        );


    const homeTeam =
        home?.team?.displayName ||
        home?.team?.name ||
        "Home";


    const awayTeam =
        away?.team?.displayName ||
        away?.team?.name ||
        "Away";


    const homeLogo =
        home?.team?.logo || "";


    const awayLogo =
        away?.team?.logo || "";


    const homeScore =
        home?.score ?? "-";


    const awayScore =
        away?.score ?? "-";


    const status =
        event.status?.type?.shortDetail ||
        event.status?.type?.detail ||
        "Scheduled";


    const statusName =
        event.status?.type?.name || "";


    const isLive =
        statusName === "STATUS_IN_PROGRESS";


    const matchTime =
        formatMatchTime(event.date);


    article.innerHTML = `

        <div class="match-time">
            ${matchTime}
        </div>

        <div class="match-content">

            <div class="team home">

                <span>
                    ${escapeHTML(homeTeam)}
                </span>

                ${
                    homeLogo
                    ?
                    `<img
                        src="${homeLogo}"
                        alt=""
                        onerror="this.style.display='none'"
                    >`
                    :
                    ""
                }

            </div>


            <div class="score">

                ${
                    isLive
                    ?
                    `<span class="live">LIVE</span><br>`
                    :
                    ""
                }

                ${homeScore} - ${awayScore}

                <span class="status">
                    ${escapeHTML(status)}
                </span>

            </div>


            <div class="team away">

                ${
                    awayLogo
                    ?
                    `<img
                        src="${awayLogo}"
                        alt=""
                        onerror="this.style.display='none'"
                    >`
                    :
                    ""
                }

                <span>
                    ${escapeHTML(awayTeam)}
                </span>

            </div>

        </div>

    `;


    return article;

}


/* =========================================================
   FORMAT TIME
   ========================================================= */

function formatMatchTime(dateString) {

    const date =
        new Date(dateString);


    return date.toLocaleTimeString(
        "en-IN",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   DATE BUTTONS
   ========================================================= */

document.querySelectorAll(".date-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".date-btn")
                    .forEach(btn =>
                        btn.classList.remove("active")
                    );


                button.classList.add("active");


                selectedDay =
                    button.dataset.day;


                loadMatches();

            }
        );

    });


/* =========================================================
   REFRESH BUTTON
   ========================================================= */

document
    .getElementById("refreshBtn")
    .addEventListener(
        "click",
        loadMatches
    );


/* =========================================================
   AUTOMATIC REFRESH
   Every 2 minutes
   ========================================================= */

setInterval(
    loadMatches,
    120000
);


/* =========================================================
   INITIAL LOAD
   ========================================================= */

loadMatches();

</script>

</body>
</html>
