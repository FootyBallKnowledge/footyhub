<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FootyHub - Matches</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #071a12;
    color: white;
    min-height: 100vh;
}

/* NAVBAR */

.navbar {
    background: #0b2419;
    border-bottom: 1px solid #1d4d35;
    padding: 16px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #48e08a;
}

.nav-links {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.nav-links a {
    color: #d8eee2;
    text-decoration: none;
    font-size: 14px;
}

.nav-links a:hover,
.nav-links a.active {
    color: #48e08a;
}

/* HEADER */

.header {
    text-align: center;
    padding: 45px 20px 25px;
}

.header h1 {
    font-size: 38px;
    margin-bottom: 10px;
}

.header p {
    color: #a9c8b8;
}

/* CONTROLS */

.controls {
    width: 90%;
    max-width: 1100px;
    margin: 20px auto;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.date-btn,
.refresh-btn {
    border: 1px solid #2d6247;
    background: #102c20;
    color: white;
    padding: 11px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.date-btn:hover,
.refresh-btn:hover {
    background: #17452f;
}

.date-btn.active {
    background: #28a765;
    border-color: #28a765;
}

/* DATE TITLE */

.date-title {
    text-align: center;
    margin: 25px 0;
}

.date-title h2 {
    font-size: 23px;
}

.date-title p {
    color: #8eaf9e;
    margin-top: 5px;
}

/* MAIN */

.container {
    width: 92%;
    max-width: 1100px;
    margin: auto;
}

/* LEAGUE */

.league {
    margin-bottom: 30px;
    background: #0b2419;
    border: 1px solid #1b4933;
    border-radius: 14px;
    overflow: hidden;
}

.league-header {
    padding: 15px 20px;
    background: #102c20;
    border-bottom: 1px solid #1b4933;
    display: flex;
    align-items: center;
    gap: 10px;
}

.league-header h3 {
    font-size: 18px;
}

.league-header span {
    color: #8eaf9e;
    font-size: 13px;
}

/* MATCH */

.match {
    display: grid;
    grid-template-columns: 1fr 100px 1fr;
    align-items: center;
    gap: 15px;
    padding: 20px;
    border-bottom: 1px solid #173b2a;
}

.match:last-child {
    border-bottom: none;
}

.team {
    display: flex;
    align-items: center;
    gap: 12px;
}

.team.home {
    justify-content: flex-end;
    text-align: right;
}

.team.away {
    justify-content: flex-start;
    text-align: left;
}

.team img {
    width: 38px;
    height: 38px;
    object-fit: contain;
}

.team-name {
    font-weight: bold;
    font-size: 15px;
}

.score-box {
    text-align: center;
}

.score {
    font-size: 22px;
    font-weight: bold;
}

.status {
    font-size: 11px;
    margin-top: 5px;
    color: #91b5a1;
    text-transform: uppercase;
    font-weight: bold;
}

.status.live {
    color: #ff5252;
}

.status.finished {
    color: #9ab5a7;
}

.status.upcoming {
    color: #48e08a;
}

/* EMPTY / ERROR */

.message {
    text-align: center;
    padding: 50px 20px;
    color: #a9c8b8;
}

.message h2 {
    color: white;
    margin-bottom: 10px;
}

.error {
    background: #351717;
    border: 1px solid #713333;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    margin: 30px auto;
    max-width: 700px;
}

.error h2 {
    color: #ff7777;
    margin-bottom: 8px;
}

.loading {
    text-align: center;
    padding: 50px;
    color: #48e08a;
}

/* FOOTER */

footer {
    text-align: center;
    padding: 35px 20px;
    margin-top: 50px;
    border-top: 1px solid #173b2a;
    color: #759887;
    font-size: 13px;
}

/* MOBILE */

@media (max-width: 700px) {

    .navbar {
        flex-direction: column;
        gap: 12px;
    }

    .nav-links {
        justify-content: center;
        gap: 12px;
    }

    .header h1 {
        font-size: 30px;
    }

    .match {
        grid-template-columns: 1fr 70px 1fr;
        gap: 5px;
        padding: 16px 10px;
    }

    .team {
        gap: 6px;
    }

    .team img {
        width: 30px;
        height: 30px;
    }

    .team-name {
        font-size: 12px;
    }

    .score {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">⚽ FootyHub</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="matches.html" class="active">Matches</a>
        <a href="leagues.html">Leagues</a>
        <a href="standings.html">Standings</a>
        <a href="players.html">Players</a>
        <a href="transfers.html">Transfers</a>
        <a href="news.html">News</a>
        <a href="quiz.html">Quiz</a>
    </div>

</nav>


<!-- HEADER -->

<header class="header">

    <h1>⚽ Football Matches</h1>

    <p>Live and upcoming matches from the world's top leagues</p>

</header>


<!-- CONTROLS -->

<div class="controls">

    <button class="date-btn active" onclick="changeDate('today', this)">
        Today
    </button>

    <button class="date-btn" onclick="changeDate('tomorrow', this)">
        Tomorrow
    </button>

    <button class="date-btn" onclick="changeDate('yesterday', this)">
        Yesterday
    </button>

    <button class="refresh-btn" onclick="loadMatches()">
        🔄 Refresh
    </button>

</div>


<!-- DATE -->

<div class="date-title">

    <h2 id="dateTitle">Today's Matches</h2>

    <p id="dateText"></p>

</div>


<!-- MATCHES -->

<main class="container" id="matchesContainer">

    <div class="loading">
        Loading matches...
    </div>

</main>


<footer>
    FootyHub © 2026 — Football statistics and match information
</footer>


<script>

/* --------------------------------------------------
   SETTINGS
-------------------------------------------------- */

const DATA_FILE = "./football-data.json";

let selectedDay = "today";


/* --------------------------------------------------
   TOP 10 LEAGUES
-------------------------------------------------- */

const TOP_LEAGUES = [

    "Premier League",
    "La Liga",
    "Bundesliga",
    "Serie A",
    "Ligue 1",
    "Eredivisie",
    "Primeira Liga",
    "Süper Lig",
    "Brasileirão",
    "Argentina Primera"

];


/* --------------------------------------------------
   GET LOCAL DATE
-------------------------------------------------- */

function getLocalDate(day) {

    const now = new Date();

    if (day === "tomorrow") {
        now.setDate(now.getDate() + 1);
    }

    if (day === "yesterday") {
        now.setDate(now.getDate() - 1);
    }

    const year = now.getFullYear();

    const month = String(now.getMonth() + 1).padStart(2, "0");

    const date = String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${date}`;
}


/* --------------------------------------------------
   FORMAT DATE
-------------------------------------------------- */

function formatDate(dateString) {

    const date = new Date(dateString + "T12:00:00");

    return date.toLocaleDateString("en-IN", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });

}


/* --------------------------------------------------
   CHANGE DATE
-------------------------------------------------- */

function changeDate(day, button) {

    selectedDay = day;

    document.querySelectorAll(".date-btn")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    if (day === "today") {
        document.getElementById("dateTitle").textContent =
            "Today's Matches";
    }

    if (day === "tomorrow") {
        document.getElementById("dateTitle").textContent =
            "Tomorrow's Matches";
    }

    if (day === "yesterday") {
        document.getElementById("dateTitle").textContent =
            "Yesterday's Matches";
    }

    loadMatches();
}


/* --------------------------------------------------
   MATCH STATUS
-------------------------------------------------- */

function getStatus(match) {

    const status = match.status;

    if (!status) {
        return {
            text: "Scheduled",
            className: "upcoming"
        };
    }

    const short = status.short || "";
    const long = status.long || "";

    /* LIVE */

    if (
        short === "1H" ||
        short === "2H" ||
        short === "ET" ||
        short === "P" ||
        short === "BT" ||
        short === "LIVE" ||
        long.toLowerCase().includes("live")
    ) {

        return {
            text: "🔴 LIVE",
            className: "live"
        };

    }


    /* FINISHED */

    if (
        short === "FT" ||
        short === "AET" ||
        short === "PEN" ||
        long.toLowerCase().includes("finished")
    ) {

        return {
            text: "Finished",
            className: "finished"
        };

    }


    /* POSTPONED */

    if (
        short === "PST" ||
        short === "CANC" ||
        long.toLowerCase().includes("postponed") ||
        long.toLowerCase().includes("cancelled")
    ) {

        return {
            text: long || "Postponed",
            className: "finished"
        };

    }


    return {
        text: "Upcoming",
        className: "upcoming"
    };

}


/* --------------------------------------------------
   TEAM LOGO
-------------------------------------------------- */

function getLogo(team) {

    if (!team) {
        return "";
    }

    return team.logo || "";

}


/* --------------------------------------------------
   SAFE TEAM NAME
-------------------------------------------------- */

function getTeamName(team) {

    if (!team) {
        return "Unknown Team";
    }

    return team.name || "Unknown Team";

}


/* --------------------------------------------------
   SCORE
-------------------------------------------------- */

function getScore(match) {

    const homeScore =
        match.goals &&
        match.goals.home !== null &&
        match.goals.home !== undefined
            ? match.goals.home
            : "-";

    const awayScore =
        match.goals &&
        match.goals.away !== null &&
        match.goals.away !== undefined
            ? match.goals.away
            : "-";

    return `${homeScore} - ${awayScore}`;

}


/* --------------------------------------------------
   RENDER MATCH
-------------------------------------------------- */

function renderMatch(match) {

    const home =
        match.teams?.home || {};

    const away =
        match.teams?.away || {};

    const status =
        getStatus(match);

    const score =
        getScore(match);

    return `

        <div class="match">

            <div class="team home">

                <div class="team-name">
                    ${getTeamName(home)}
                </div>

                ${
                    getLogo(home)
                    ?
                    `<img src="${getLogo(home)}"
                          alt="${getTeamName(home)} logo"
                          onerror="this.style.display='none'">`
                    :
                    ""
                }

            </div>


            <div class="score-box">

                <div class="score">
                    ${score}
                </div>

                <div class="status ${status.className}">
                    ${status.text}
                </div>

            </div>


            <div class="team away">

                ${
                    getLogo(away)
                    ?
                    `<img src="${getLogo(away)}"
                          alt="${getTeamName(away)} logo"
                          onerror="this.style.display='none'">`
                    :
                    ""
                }

                <div class="team-name">
                    ${getTeamName(away)}
                </div>

            </div>

        </div>

    `;

}


/* --------------------------------------------------
   RENDER LEAGUE
-------------------------------------------------- */

function renderLeague(leagueName, matches) {

    return `

        <section class="league">

            <div class="league-header">

                <h3>🏆 ${leagueName}</h3>

                <span>
                    ${matches.length}
                    ${matches.length === 1 ? "match" : "matches"}
                </span>

            </div>

            ${matches.map(renderMatch).join("")}

        </section>

    `;

}


/* --------------------------------------------------
   LOAD MATCHES
-------------------------------------------------- */

async function loadMatches() {

    const container =
        document.getElementById("matchesContainer");

    container.innerHTML = `
        <div class="loading">
            ⚽ Loading matches...
        </div>
    `;


    const date =
        getLocalDate(selectedDay);


    document.getElementById("dateText").textContent =
        formatDate(date);


    try {

        /*
         * Cache-busting parameter ensures GitHub Pages
         * requests the latest JSON.
         */

        const response =
            await fetch(DATA_FILE + "?v=" + Date.now(), {
                cache: "no-store"
            });


        if (!response.ok) {

            throw new Error(
                "football-data.json could not be loaded. HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (!data || !Array.isArray(data.matches)) {

            throw new Error(
                "football-data.json does not contain a valid matches array."
            );

        }


        console.log("FootyHub data loaded:", data);

        console.log(
            "Looking for date:",
            date
        );


        /*
         * Find matches for selected date.
         *
         * We also accept date/time strings such as:
         * 2026-09-08T18:00:00
         */

        const matches =
            data.matches.filter(match => {

                if (!match.date) {
                    return false;
                }

                return String(match.date).substring(0, 10) === date;

            });


        console.log(
            "Matches found:",
            matches.length
        );


        /* No matches */

        if (matches.length === 0) {

            container.innerHTML = `

                <div class="message">

                    <h2>⚽ No matches found</h2>

                    <p>
                        There are no matches available for
                        ${formatDate(date)}.
                    </p>

                </div>

            `;

            return;

        }


        /*
         * Group matches by league
         */

        const leagues = {};


        matches.forEach(match => {

            let leagueName =
                match.league?.name ||
                match.league_name ||
                "Other Matches";


            /*
             * Keep the league name consistent
             */

            if (!leagues[leagueName]) {
                leagues[leagueName] = [];
            }

            leagues[leagueName].push(match);

        });


        /*
         * Sort leagues according to Top 10 order.
         */

        const sortedLeagues =
            Object.keys(leagues).sort((a, b) => {

                const indexA =
                    TOP_LEAGUES.indexOf(a);

                const indexB =
                    TOP_LEAGUES.indexOf(b);

                if (indexA === -1 && indexB === -1) {
                    return a.localeCompare(b);
                }

                if (indexA === -1) {
                    return 1;
                }

                if (indexB === -1) {
                    return -1;
                }

                return indexA - indexB;

            });


        /*
         * Create HTML
         */

        let html = "";


        sortedLeagues.forEach(leagueName => {

            html +=
                renderLeague(
                    leagueName,
                    leagues[leagueName]
                );

        });


        container.innerHTML = html;


    } catch (error) {

        console.error(
            "FootyHub error:",
            error
        );


        container.innerHTML = `

            <div class="error">

                <h2>⚠️ Unable to load matches</h2>

                <p>
                    ${error.message}
                </p>

                <br>

                <button
                    class="refresh-btn"
                    onclick="loadMatches()">
                    🔄 Try Again
                </button>

            </div>

        `;

    }

}


/* --------------------------------------------------
   INITIAL LOAD
-------------------------------------------------- */

document.addEventListener(
    "DOMContentLoaded",
    loadMatches
);


/* --------------------------------------------------
   AUTO REFRESH
--------------------------------------------------

   Refresh every 5 minutes.
*/

setInterval(
    loadMatches,
    5 * 60 * 1000
);

</script>

</body>
</html>
