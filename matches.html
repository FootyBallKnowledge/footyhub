<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FootyHub - Matches</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #071a12;
    color: white;
}

.navbar {
    background: #0b2419;
    padding: 16px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1d4d35;
}

.logo {
    color: #48e08a;
    font-size: 24px;
    font-weight: bold;
}

.nav-links {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
}

.nav-links a {
    color: #d8eee2;
    text-decoration: none;
    font-size: 14px;
}

.nav-links a:hover,
.nav-links a.active {
    color: #48e08a;
}

.header {
    text-align: center;
    padding: 40px 20px 25px;
}

.header h1 {
    font-size: 38px;
    margin-bottom: 10px;
}

.header p {
    color: #9db9aa;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 20px;
}

button {
    padding: 11px 20px;
    border-radius: 8px;
    border: 1px solid #2d6247;
    background: #102c20;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #17452f;
}

button.active {
    background: #28a765;
}

.date-title {
    text-align: center;
    margin: 25px 0;
}

.date-title h2 {
    margin-bottom: 6px;
}

.date-title p {
    color: #8fae9d;
}

.container {
    width: 92%;
    max-width: 1100px;
    margin: auto;
}

.league {
    background: #0b2419;
    border: 1px solid #1d4934;
    border-radius: 14px;
    margin-bottom: 25px;
    overflow: hidden;
}

.league-header {
    background: #102c20;
    padding: 15px 20px;
    border-bottom: 1px solid #1d4934;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.league-header h3 {
    font-size: 18px;
}

.league-header span {
    color: #8fae9d;
    font-size: 13px;
}

.match {
    display: grid;
    grid-template-columns: 1fr 100px 1fr;
    align-items: center;
    padding: 20px;
    border-bottom: 1px solid #173b2a;
}

.match:last-child {
    border-bottom: none;
}

.team {
    display: flex;
    align-items: center;
    gap: 10px;
}

.home {
    justify-content: flex-end;
    text-align: right;
}

.away {
    justify-content: flex-start;
}

.team img {
    width: 40px;
    height: 40px;
    object-fit: contain;
}

.team-name {
    font-weight: bold;
    font-size: 15px;
}

.score-box {
    text-align: center;
}

.score {
    font-size: 22px;
    font-weight: bold;
}

.status {
    margin-top: 5px;
    font-size: 11px;
    text-transform: uppercase;
    font-weight: bold;
}

.live {
    color: #ff5555;
}

.finished {
    color: #91aa9d;
}

.upcoming {
    color: #48e08a;
}

.loading {
    text-align: center;
    padding: 60px;
    color: #48e08a;
}

.message {
    background: #0b2419;
    border: 1px solid #1d4934;
    border-radius: 12px;
    padding: 35px;
    text-align: center;
    color: #a9c8b8;
}

.message h2 {
    color: white;
    margin-bottom: 12px;
}

.error {
    background: #351717;
    border: 1px solid #713333;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
}

.error h2 {
    color: #ff7777;
    margin-bottom: 10px;
}

.debug {
    margin-top: 15px;
    font-size: 12px;
    color: #aaa;
    word-break: break-word;
}

footer {
    text-align: center;
    color: #718e80;
    padding: 40px 20px;
    margin-top: 40px;
    border-top: 1px solid #173b2a;
}

@media(max-width:700px) {

    .navbar {
        flex-direction: column;
        gap: 12px;
    }

    .nav-links {
        justify-content: center;
    }

    .header h1 {
        font-size: 30px;
    }

    .match {
        grid-template-columns: 1fr 70px 1fr;
        padding: 15px 8px;
    }

    .team img {
        width: 30px;
        height: 30px;
    }

    .team-name {
        font-size: 12px;
    }

    .score {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<nav class="navbar">

    <div class="logo">⚽ FootyHub</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="matches.html" class="active">Matches</a>
        <a href="leagues.html">Leagues</a>
        <a href="standings.html">Standings</a>
        <a href="players.html">Players</a>
        <a href="transfers.html">Transfers</a>
        <a href="news.html">News</a>
        <a href="quiz.html">Quiz</a>
    </div>

</nav>

<header class="header">

    <h1>⚽ Football Matches</h1>

    <p>Matches from the world's top football leagues</p>

</header>

<div class="controls">

    <button id="todayBtn"
            class="active"
            onclick="selectDay('today')">
        Today
    </button>

    <button id="tomorrowBtn"
            onclick="selectDay('tomorrow')">
        Tomorrow
    </button>

    <button id="yesterdayBtn"
            onclick="selectDay('yesterday')">
        Yesterday
    </button>

    <button onclick="loadMatches()">
        🔄 Refresh
    </button>

</div>

<div class="date-title">

    <h2 id="dateTitle">Today's Matches</h2>

    <p id="dateText"></p>

</div>

<main class="container" id="matchesContainer">

    <div class="loading">
        ⚽ Loading football matches...
    </div>

</main>

<footer>
    FootyHub © 2026
</footer>


<script>

let selectedDay = "today";

const DATA_FILE = "./football-data.json";


/* ---------------------------------------
   GET DATE IN INDIA
--------------------------------------- */

function getIndiaDate(offset = 0) {

    const now = new Date();

    const indiaTime = new Date(
        now.toLocaleString("en-US", {
            timeZone: "Asia/Kolkata"
        })
    );

    indiaTime.setDate(
        indiaTime.getDate() + offset
    );

    const year =
        indiaTime.getFullYear();

    const month =
        String(indiaTime.getMonth() + 1)
        .padStart(2, "0");

    const day =
        String(indiaTime.getDate())
        .padStart(2, "0");

    return `${year}-${month}-${day}`;
}


/* ---------------------------------------
   SELECT DAY
--------------------------------------- */

function selectDay(day) {

    selectedDay = day;

    document
        .querySelectorAll(".controls button")
        .forEach(button => {
            button.classList.remove("active");
        });

    if (day === "today") {

        document
            .getElementById("todayBtn")
            .classList.add("active");

        document
            .getElementById("dateTitle")
            .textContent = "Today's Matches";
    }

    if (day === "tomorrow") {

        document
            .getElementById("tomorrowBtn")
            .classList.add("active");

        document
            .getElementById("dateTitle")
            .textContent = "Tomorrow's Matches";
    }

    if (day === "yesterday") {

        document
            .getElementById("yesterdayBtn")
            .classList.add("active");

        document
            .getElementById("dateTitle")
            .textContent = "Yesterday's Matches";
    }

    loadMatches();
}


/* ---------------------------------------
   GET SELECTED DATE
--------------------------------------- */

function getSelectedDate() {

    if (selectedDay === "today") {
        return getIndiaDate(0);
    }

    if (selectedDay === "tomorrow") {
        return getIndiaDate(1);
    }

    return getIndiaDate(-1);
}


/* ---------------------------------------
   FORMAT DATE
--------------------------------------- */

function formatDate(dateString) {

    const date =
        new Date(dateString + "T12:00:00");

    return date.toLocaleDateString(
        "en-IN",
        {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );
}


/* ---------------------------------------
   STATUS
--------------------------------------- */

function getMatchStatus(match) {

    const status =
        match.status || {};

    const short =
        String(status.short || "")
        .toUpperCase();

    const long =
        String(status.long || "")
        .toLowerCase();


    if (
        short === "1H" ||
        short === "2H" ||
        short === "ET" ||
        short === "P" ||
        short === "LIVE" ||
        long.includes("live")
    ) {

        return {
            text: "🔴 LIVE",
            className: "live"
        };

    }


    if (
        short === "FT" ||
        short === "AET" ||
        short === "PEN" ||
        long.includes("finished")
    ) {

        return {
            text: "Finished",
            className: "finished"
        };

    }


    if (
        short === "PST" ||
        short === "CANC"
    ) {

        return {
            text: long || "Postponed",
            className: "finished"
        };

    }


    return {
        text: "Upcoming",
        className: "upcoming"
    };
}


/* ---------------------------------------
   TEAM
--------------------------------------- */

function teamName(team) {

    return team?.name || "Unknown Team";

}


function teamLogo(team) {

    return team?.logo || "";

}


/* ---------------------------------------
   RENDER MATCH
--------------------------------------- */

function renderMatch(match) {

    const home =
        match.teams?.home || {};

    const away =
        match.teams?.away || {};

    const goals =
        match.goals || {};

    const homeScore =
        goals.home === null ||
        goals.home === undefined
            ? "-"
            : goals.home;

    const awayScore =
        goals.away === null ||
        goals.away === undefined
            ? "-"
            : goals.away;

    const status =
        getMatchStatus(match);


    return `

        <div class="match">

            <div class="team home">

                <div class="team-name">
                    ${teamName(home)}
                </div>

                ${
                    teamLogo(home)
                    ?
                    `<img src="${teamLogo(home)}"
                          alt=""
                          onerror="this.style.display='none'">`
                    :
                    ""
                }

            </div>


            <div class="score-box">

                <div class="score">
                    ${homeScore} - ${awayScore}
                </div>

                <div class="status ${status.className}">
                    ${status.text}
                </div>

            </div>


            <div class="team away">

                ${
                    teamLogo(away)
                    ?
                    `<img src="${teamLogo(away)}"
                          alt=""
                          onerror="this.style.display='none'">`
                    :
                    ""
                }

                <div class="team-name">
                    ${teamName(away)}
                </div>

            </div>

        </div>

    `;
}


/* ---------------------------------------
   RENDER LEAGUE
--------------------------------------- */

function renderLeague(name, matches) {

    return `

        <section class="league">

            <div class="league-header">

                <h3>🏆 ${name}</h3>

                <span>
                    ${matches.length}
                    ${matches.length === 1
                        ? "match"
                        : "matches"}
                </span>

            </div>

            ${matches
                .map(renderMatch)
                .join("")}

        </section>

    `;
}


/* ---------------------------------------
   LOAD DATA
--------------------------------------- */

async function loadMatches() {

    const container =
        document.getElementById(
            "matchesContainer"
        );


    container.innerHTML = `
        <div class="loading">
            ⚽ Loading matches...
        </div>
    `;


    const selectedDate =
        getSelectedDate();


    document
        .getElementById("dateText")
        .textContent =
            formatDate(selectedDate);


    try {

        console.log(
            "Loading:",
            DATA_FILE
        );


        const response =
            await fetch(
                DATA_FILE + "?v=" + Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Could not load football-data.json. HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "Football data:",
            data
        );


        if (
            !data ||
            !Array.isArray(data.matches)
        ) {

            throw new Error(
                "The JSON file does not contain a matches array."
            );

        }


        /*
         * IMPORTANT:
         * Extract the date from every match.
         */

        const matches =
            data.matches.filter(match => {

                if (!match.date) {
                    return false;
                }

                const matchDate =
                    String(match.date)
                    .substring(0, 10);

                return matchDate === selectedDate;

            });


        console.log(
            "Selected date:",
            selectedDate
        );

        console.log(
            "Matches found:",
            matches.length
        );


        /* -----------------------------------
           SHOW MATCHES
        ----------------------------------- */

        if (matches.length > 0) {

            const leagues = {};


            matches.forEach(match => {

                const leagueName =
                    match.league?.name ||
                    match.league_name ||
                    "Other Matches";


                if (!leagues[leagueName]) {
                    leagues[leagueName] = [];
                }


                leagues[leagueName].push(match);

            });


            let html = "";


            Object.keys(leagues)
                .sort()
                .forEach(leagueName => {

                    html +=
                        renderLeague(
                            leagueName,
                            leagues[leagueName]
                        );

                });


            container.innerHTML = html;

            return;
        }


        /* -----------------------------------
           NO MATCHES
        ----------------------------------- */

        const availableDates =
            [...new Set(
                data.matches
                    .filter(m => m.date)
                    .map(m =>
                        String(m.date)
                        .substring(0, 10)
                    )
            )];


        container.innerHTML = `

            <div class="message">

                <h2>
                    ⚽ No matches for this date
                </h2>

                <p>
                    We looked for matches on
                    <strong>${selectedDate}</strong>.
                </p>

                <div class="debug">

                    Dates available in football-data.json:

                    <br><br>

                    ${availableDates.join(" • ")}

                </div>

            </div>

        `;


    } catch (error) {

        console.error(
            "FootyHub error:",
            error
        );


        container.innerHTML = `

            <div class="error">

                <h2>
                    ⚠️ Unable to load matches
                </h2>

                <p>
                    ${error.message}
                </p>

                <div class="debug">
                    File:
                    ${DATA_FILE}
                </div>

                <br>

                <button onclick="loadMatches()">
                    🔄 Try Again
                </button>

            </div>

        `;

    }

}


/* ---------------------------------------
   START
--------------------------------------- */

document.addEventListener(
    "DOMContentLoaded",
    loadMatches
);


/* Refresh every 5 minutes */

setInterval(
    loadMatches,
    5 * 60 * 1000
);

</script>

</body>
</html>
