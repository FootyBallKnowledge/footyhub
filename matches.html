```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FootyHub | Matches</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #071b14;
    color: #ffffff;
}

/* HEADER */
header {
    background: #0b2a1f;
    padding: 18px 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #174c39;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 26px;
    font-weight: bold;
    color: #39e58c;
}

.logo span {
    color: white;
}

nav {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

nav a {
    color: #d8f5e6;
    text-decoration: none;
    padding: 9px 13px;
    border-radius: 8px;
    font-size: 14px;
}

nav a:hover,
nav a.active {
    background: #39e58c;
    color: #062016;
}

/* PAGE HEADER */
.page-header {
    padding: 55px 6% 35px;
    background: linear-gradient(135deg, #0b3325, #071b14);
}

.page-header h1 {
    font-size: 42px;
    margin-bottom: 10px;
}

.page-header p {
    color: #a8c9ba;
    font-size: 16px;
}

/* FILTERS */
.filters {
    padding: 25px 6%;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    background: #091f17;
}

.filter-btn {
    border: 1px solid #256449;
    background: #0e2c21;
    color: #d8f5e6;
    padding: 11px 22px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
}

.filter-btn:hover,
.filter-btn.active {
    background: #39e58c;
    color: #062016;
}

/* CONTENT */
.container {
    width: 88%;
    max-width: 1200px;
    margin: 30px auto 70px;
}

/* DATE */
.date-title {
    margin: 35px 0 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.date-title h2 {
    font-size: 24px;
}

.date-title span {
    color: #8fb7a5;
    font-size: 14px;
}

/* LEAGUE */
.league-section {
    background: #0b241a;
    border: 1px solid #174c39;
    border-radius: 14px;
    margin-bottom: 22px;
    overflow: hidden;
}

.league-header {
    padding: 15px 20px;
    background: #103426;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.league-header h3 {
    font-size: 16px;
}

.league-header span {
    color: #86c9a8;
    font-size: 13px;
}

/* MATCH */
.match {
    display: grid;
    grid-template-columns: 1fr 120px 1fr;
    align-items: center;
    gap: 15px;
    padding: 20px;
    border-top: 1px solid #174333;
}

.team {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: bold;
}

.team.home {
    justify-content: flex-end;
    text-align: right;
}

.team-logo {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #153e2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.match-info {
    text-align: center;
}

.time {
    color: #39e58c;
    font-weight: bold;
    font-size: 17px;
}

.status {
    color: #8cae9f;
    font-size: 12px;
    margin-top: 5px;
}

/* LIVE */
.live {
    color: #ff6b6b;
    font-weight: bold;
}

/* EMPTY */
.empty {
    text-align: center;
    padding: 50px 20px;
    color: #9bb7aa;
}

/* FOOTER */
footer {
    border-top: 1px solid #174c39;
    background: #061710;
    padding: 25px 6%;
    text-align: center;
    color: #7e9e90;
    font-size: 13px;
}

/* MOBILE */
@media(max-width: 700px) {

    header {
        flex-direction: column;
        gap: 15px;
    }

    nav {
        justify-content: center;
    }

    .page-header h1 {
        font-size: 32px;
    }

    .match {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 12px;
    }

    .team.home,
    .team {
        justify-content: center;
        text-align: center;
    }

    .match-info {
        order: -1;
    }
}
</style>
</head>

<body>

        ⚽ <span>Footy</span>Hub
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="matches.html" class="active">Matches</a>
        <a href="leagues.html">Leagues</a>

</header>


<section class="page-header">

    <h1>⚽ Football Matches</h1>

    <p>
        Follow today's football fixtures, live games and completed matches.
    </p>

</section>


<div class="filters">

    <button class="filter-btn active" onclick="showMatches('today', this)">
        Today
    </button>

    <button class="filter-btn" onclick="showMatches('tomorrow', this)">
        Tomorrow
    </button>

    <button class="filter-btn" onclick="showMatches('yesterday', this)">
        Yesterday
    </button>

</div>


<main class="container">

    <div class="date-title">

        <h2 id="dateHeading">Today's Matches</h2>

        <span id="matchCount">6 matches</span>

    </div>


    <div id="matchesContainer">

        <!-- Matches are inserted here -->

    </div>

</main>


<footer>

    © 2026 FootyHub • Football statistics and match centre

</footer>


<script>

/*
    FOOTYHUB MATCH DATABASE

    These are demonstration fixtures.
    Later, this section can be connected
    to a football API for automatic updates.
*/

const matches = {

    today: [

        {
            league: "UEFA Champions League",
            country: "Europe",
            home: "Real Madrid",
            away: "Inter Milan",
            time: "21:00",
            status: "Upcoming"
        },

        {
            league: "UEFA Champions League",
            country: "Europe",
            home: "Dortmund",
            away: "Villarreal",

        },

        {
            league: "UEFA Champions League",

            home: "Porto",
            away: "Manchester City",
            time: "21:00",

        },

        {
            league: "UEFA Champions League",
            country: "Europe",
            home: "Club Brugge",
            away: "Aston Villa",
            time: "18:45",
            status: "Upcoming"
        },

        {
            league: "Premier League",
            country: "England",
            home: "Arsenal",
            away: "Chelsea",

            status: "Upcoming"
        },

        {
            league: "La Liga",
            country: "Spain",
            home: "Barcelona",
            away: "Sevilla",
            time: "21:30",
            status: "Upcoming"
        }

    ],

    tomorrow: [

        {
            league: "UEFA Champions League",
            country: "Europe",
            home: "Liverpool",
            away: "Atletico Madrid",
            time: "21:00",
            status: "Upcoming"
        },

        {
            league: "UEFA Champions League",
            country: "Europe",
            home: "Napoli",
            away: "Arsenal",
            time: "21:00",
            status: "Upcoming"
        },

        {
            league: "UEFA Champions League",
            country: "Europe",
            home: "PSG",
            away: "Slovan Bratislava",
            time: "21:00",
            status: "Upcoming"
        },

        {
            league: "La Liga",
            country: "Spain",
            home: "Barcelona",
            away: "Feyenoord",
            time: "18:45",

        }

    ],

    yesterday: [

        {
            league: "Premier League",

            score: "2 - 1"
        },

        {
            league: "La Liga",
            country: "Spain",
            home: "Real Sociedad",
            away: "Valencia",
            time: "19:00",
            status: "FT",
            score: "1 - 1"
        },

        {
            league: "Serie A",
            country: "Italy",
            home: "AC Milan",
            away: "Roma",
            time: "20:45",
            status: "FT",
            score: "3 - 1"
        }

    ]

};


/* SHOW MATCHES */

function showMatches(day, button) {

    document
        .querySelectorAll(".filter-btn")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    let heading = document.getElementById("dateHeading");

    if(day === "today") {
        heading.innerText = "Today's Matches";
    }

    if(day === "tomorrow") {
        heading.innerText = "Tomorrow's Matches";
    }

    if(day === "yesterday") {
        heading.innerText = "Yesterday's Matches";
    }

    renderMatches(matches[day]);

}


/* RENDER MATCHES */

function renderMatches(list) {

    const container =
        document.getElementById("matchesContainer");

    const count =
        document.getElementById("matchCount");

    container.innerHTML = "";

    count.innerText =
        list.length +
        (list.length === 1 ? " match" : " matches");


    if(list.length === 0) {

        container.innerHTML = `
            <div class="empty">
                No matches available.
            </div>
        `;

        return;
    }


    /*
        Group matches by league
    */

    const leagues = {};

    list.forEach(match => {

        if(!leagues[match.league]) {
            leagues[match.league] = [];
        }

        leagues[match.league].push(match);

    });


    Object.keys(leagues).forEach(league => {

        const section =
            document.createElement("section");

        section.className = "league-section";


        section.innerHTML = `

            <div class="league-header">

                <h3>🏆 ${league}</h3>

                <span>
                    ${leagues[league][0].country}
                </span>

            </div>

        `;


        leagues[league].forEach(match => {

            const matchElement =
                document.createElement("div");

            matchElement.className = "match";


            let score =
                match.score
                ? match.score
                : match.time;


            let statusClass =
                match.status === "LIVE"
                ? "live"
                : "";


            matchElement.innerHTML = `

                <div class="team home">

                    <span>${match.home}</span>

                    <div class="team-logo">
                        ⚽
                    </div>

                </div>


                <div class="match-info">

                    <div class="time">
                        ${score}
                    </div>

                    <div class="status ${statusClass}">
                        ${match.status}
                    </div>

                </div>


                <div class="team">

                    <div class="team-logo">
                        ⚽
                    </div>

                    <span>${match.away}</span>

                </div>

            `;


            section.appendChild(matchElement);

        });


        container.appendChild(section);

    });

}


/* LOAD TODAY BY DEFAULT */

renderMatches(matches.today);

</script>
