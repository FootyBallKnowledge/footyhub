<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FootyHub - Football Matches</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #17202a;
}

header {
    background: #071952;
    color: white;
    padding: 20px;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 26px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 18px;
    font-size: 15px;
}

nav a:hover {
    text-decoration: underline;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
}

.hero {
    background: white;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.hero h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.hero p {
    color: #667085;
}

.tabs {
    display: flex;
    gap: 10px;
    margin: 20px 0;
    flex-wrap: wrap;
}

.tab {
    border: none;
    background: white;
    padding: 12px 20px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.tab.active {
    background: #071952;
    color: white;
}

.status {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    color: #667085;
}

.error {
    background: #fff1f0;
    color: #b42318;
    border: 1px solid #fecdca;
}

.league {
    background: white;
    border-radius: 15px;
    margin-bottom: 20px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.league-header {
    background: #071952;
    color: white;
    padding: 15px 20px;
    font-size: 18px;
    font-weight: bold;
}

.match {
    display: grid;
    grid-template-columns: 1fr 90px 1fr;
    align-items: center;
    gap: 15px;
    padding: 20px;
    border-bottom: 1px solid #eaecf0;
}

.match:last-child {
    border-bottom: none;
}

.team {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: bold;
}

.team.home {
    justify-content: flex-end;
    text-align: right;
}

.team.away {
    justify-content: flex-start;
}

.team img {
    width: 38px;
    height: 38px;
    object-fit: contain;
}

.score {
    text-align: center;
}

.score-number {
    font-size: 22px;
    font-weight: bold;
}

.match-time {
    display: block;
    margin-top: 5px;
    font-size: 12px;
    color: #667085;
}

.live {
    color: #d92d20;
    font-weight: bold;
}

.finished {
    color: #027a48;
    font-weight: bold;
}

.scheduled {
    color: #175cd3;
    font-weight: bold;
}

.no-matches {
    background: white;
    padding: 35px;
    text-align: center;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

footer {
    text-align: center;
    padding: 30px;
    color: #667085;
}

@media(max-width: 650px) {

    .header-inner {
        flex-direction: column;
        gap: 15px;
    }

    nav a {
        margin: 0 6px;
    }

    .hero h1 {
        font-size: 24px;
    }

    .match {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 10px;
    }

    .team.home,
    .team.away {
        justify-content: center;
        text-align: center;
    }

    .score {
        order: 3;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">⚽ FootyHub</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="matches.html">Matches</a>
            <a href="leagues.html">Leagues</a>
            <a href="standings.html">Standings</a>
        </nav>

    </div>
</header>


<main class="container">

    <section class="hero">
        <h1>⚽ Football Matches</h1>
        <p>Live, upcoming and completed football matches.</p>
    </section>


    <div class="tabs">

        <button class="tab active" onclick="changeDate('today', this)">
            Today
        </button>

        <button class="tab" onclick="changeDate('tomorrow', this)">
            Tomorrow
        </button>

        <button class="tab" onclick="changeDate('yesterday', this)">
            Yesterday
        </button>

    </div>


    <div id="status" class="status">
        Loading football matches...
    </div>


    <div id="matches"></div>

</main>


<footer>
    <strong>⚽ FootyHub</strong>
    <br>
    Your football world in one place.
    <br><br>
    Live Scores • Fixtures • Results • Tables
    <br><br>
    © 2026 FootyHub
</footer>


<script>

let footballData = null;
let selectedDate = "today";


/* --------------------------------
   GET DATE
-------------------------------- */

function getDate(type) {

    const date = new Date();

    if (type === "tomorrow") {
        date.setDate(date.getDate() + 1);
    }

    if (type === "yesterday") {
        date.setDate(date.getDate() - 1);
    }

    const year = date.getFullYear();

    const month = String(date.getMonth() + 1).padStart(2, "0");

    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


/* --------------------------------
   CHANGE DATE
-------------------------------- */

function changeDate(type, button) {

    selectedDate = type;

    document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
    });

    button.classList.add("active");

    displayMatches();
}


/* --------------------------------
   LOAD JSON
-------------------------------- */

async function loadFootballData() {

    const status = document.getElementById("status");

    try {

        status.className = "status";

        status.innerHTML = "⏳ Loading football data...";


        /*
           Cache-busting parameter prevents
           GitHub Pages from showing old JSON.
        */

        const url = "./football-data.json?time=" + Date.now();


        const response = await fetch(url, {
            cache: "no-store"
        });


        if (!response.ok) {

            throw new Error(
                "football-data.json could not be loaded. HTTP " +
                response.status
            );

        }


        footballData = await response.json();


        console.log("FootyHub data:", footballData);


        status.innerHTML =
            "✅ Football data loaded successfully.";


        displayMatches();

    }

    catch (error) {

        console.error(error);


        status.className = "status error";

        status.innerHTML =
            "❌ <strong>Data loading error</strong><br><br>" +
            error.message +
            "<br><br>" +
            "Please make sure football-data.json exists in the same GitHub repository.";

    }

}


/* --------------------------------
   DISPLAY MATCHES
-------------------------------- */

function displayMatches() {

    const container = document.getElementById("matches");

    container.innerHTML = "";


    if (!footballData) {

        return;

    }


    const date = getDate(selectedDate);


    console.log("Looking for date:", date);


    /*
       Your JSON uses dates such as:

       2026-09-08
       2026-09-07
       2026-09-09

       So we first look for that exact date.
    */

    let matches = footballData[date];


    /*
       Some versions of the JSON may store
       matches inside a "matches" property.
    */

    if (!matches && footballData.matches) {

        matches = footballData.matches.filter(match => {

            return match.date === date;

        });

    }


    if (!matches) {

        container.innerHTML = `
            <div class="no-matches">

                <h2>No matches found</h2>

                <br>

                <p>
                    There is no football data for
                    <strong>${date}</strong>.
                </p>

            </div>
        `;

        return;

    }


    /*
       If the date contains leagues as an object
    */

    if (!Array.isArray(matches)) {

        displayLeagueObject(matches);

        return;

    }


    /*
       If the date directly contains an array
    */

    displayMatchArray(matches);

}


/* --------------------------------
   LEAGUE OBJECT
-------------------------------- */

function displayLeagueObject(leagues) {

    const container = document.getElementById("matches");

    let found = false;


    Object.keys(leagues).forEach(leagueName => {

        const leagueMatches = leagues[leagueName];


        if (!Array.isArray(leagueMatches)) {

            return;

        }


        if (leagueMatches.length === 0) {

            return;

        }


        found = true;


        const leagueDiv = document.createElement("div");

        leagueDiv.className = "league";


        leagueDiv.innerHTML = `
            <div class="league-header">
                ${leagueName}
            </div>
        `;


        leagueMatches.forEach(match => {

            leagueDiv.appendChild(
                createMatch(match)
            );

        });


        container.appendChild(leagueDiv);

    });


    if (!found) {

        container.innerHTML = `
            <div class="no-matches">
                <h2>No matches found</h2>
                <br>
                <p>Try another date.</p>
            </div>
        `;

    }

}


/* --------------------------------
   MATCH ARRAY
-------------------------------- */

function displayMatchArray(matches) {

    const container = document.getElementById("matches");


    /*
       Group matches by league
    */

    const leagues = {};


    matches.forEach(match => {

        const league =
            match.league?.name ||
            match.league ||
            "Football";


        if (!leagues[league]) {

            leagues[league] = [];

        }


        leagues[league].push(match);

    });


    Object.keys(leagues).forEach(leagueName => {

        const leagueDiv =
            document.createElement("div");


        leagueDiv.className = "league";


        leagueDiv.innerHTML = `
            <div class="league-header">
                ${leagueName}
            </div>
        `;


        leagues[leagueName].forEach(match => {

            leagueDiv.appendChild(
                createMatch(match)
            );

        });


        container.appendChild(leagueDiv);

    });

}


/* --------------------------------
   CREATE MATCH
-------------------------------- */

function createMatch(match) {

    const div = document.createElement("div");

    div.className = "match";


    /*
       Support API-Football structure
    */

    const home =
        match.teams?.home?.name ||
        match.home?.name ||
        match.home ||
        "Home";


    const away =
        match.teams?.away?.name ||
        match.away?.name ||
        match.away ||
        "Away";


    const homeLogo =
        match.teams?.home?.logo ||
        match.home?.logo ||
        "";


    const awayLogo =
        match.teams?.away?.logo ||
        match.away?.logo ||
        "";


    const homeScore =
        match.goals?.home ??
        match.score?.fulltime?.home ??
        match.homeScore ??
        "-";


    const awayScore =
        match.goals?.away ??
        match.score?.fulltime?.away ??
        match.awayScore ??
        "-";


    const status =
        match.fixture?.status?.short ||
        match.status?.short ||
        match.status ||
        "NS";


    const time =
        match.fixture?.date ||
        match.date ||
        "";


    let statusText = "Upcoming";

    let statusClass = "scheduled";


    if (
        status === "FT" ||
        status === "AET" ||
        status === "PEN"
    ) {

        statusText = "Finished";

        statusClass = "finished";

    }


    if (
        status === "1H" ||
        status === "2H" ||
        status === "HT" ||
        status === "ET"
    ) {

        statusText = "🔴 LIVE";

        statusClass = "live";

    }


    let formattedTime = "";


    if (time) {

        try {

            formattedTime =
                new Date(time).toLocaleTimeString(
                    "en-IN",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

        }

        catch {

            formattedTime = "";

        }

    }


    div.innerHTML = `

        <div class="team home">

            <span>${home}</span>

            ${
                homeLogo
                ?
                `<img src="${homeLogo}" alt="">`
                :
                "⚽"
            }

        </div>


        <div class="score">

            <div class="score-number">
                ${homeScore} - ${awayScore}
            </div>

            <span class="match-time ${statusClass}">
                ${statusText}
            </span>

            ${
                formattedTime
                ?
                `<span class="match-time">
                    ${formattedTime}
                </span>`
                :
                ""
            }

        </div>


        <div class="team away">

            ${
                awayLogo
                ?
                `<img src="${awayLogo}" alt="">`
                :
                "⚽"
            }

            <span>${away}</span>

        </div>

    `;


    return div;

}


/* --------------------------------
   START
-------------------------------- */

loadFootballData();


/*
   Automatically refresh every 5 minutes.
*/

setInterval(() => {

    loadFootballData();

}, 300000);

</script>

</body>
</html>
