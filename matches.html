```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FootyHub | Matches</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#071b14;
    color:#fff;
}

header{
    background:#0b2a1f;
    padding:18px 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #174c39;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:26px;
    font-weight:bold;
    color:#39e58c;
}

.logo span{color:#fff}

nav{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

nav a{
    color:#d8f5e6;
    text-decoration:none;
    padding:9px 13px;
    border-radius:8px;
    font-size:14px;
}

nav a:hover,nav a.active{
    background:#39e58c;
    color:#062016;
}

.hero{
    padding:55px 6% 35px;
    background:linear-gradient(135deg,#0b3325,#071b14);
}

.hero h1{
    font-size:42px;
    margin-bottom:10px;
}

.hero p{
    color:#a8c9ba;
}

.filters{
    padding:25px 6%;
    background:#091f17;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.filter{
    background:#0e2c21;
    color:#d8f5e6;
    border:1px solid #256449;
    padding:11px 20px;
    border-radius:25px;
    cursor:pointer;
    font-weight:bold;
}

.filter.active,.filter:hover{
    background:#39e58c;
    color:#062016;
}

.container{
    width:88%;
    max-width:1200px;
    margin:30px auto 70px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.topbar h2{font-size:24px}

.updated{
    color:#8fb7a5;
    font-size:13px;
}

.league{
    background:#0b241a;
    border:1px solid #174c39;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:22px;
}

.league-title{
    background:#103426;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.league-title h3{font-size:16px}

.league-title span{
    color:#86c9a8;

    grid-template-columns:1fr 130px 1fr;
    align-items:center;

    display:flex;

.team img{

.score{

.time{

.status{

    header{
        flex-direction:column;
        gap:15px;
    }

    .hero h1{font-size:32px}

    .match{
        grid-template-columns:1fr;
        text-align:center;
    }

    .home,.team{
        justify-content:center;

        flex-direction:column;

</style>
</head>

<body>

<header>
    <div class="logo">⚽ <span>Footy</span>Hub</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="matches.html" class="active">Matches</a>
        <a href="leagues.html">Leagues</a>
        <a href="standings.html">Standings</a>
        <a href="players.html">Players</a>
        <a href="transfers.html">Transfers</a>
        <a href="news.html">News</a>
    </nav>
</header>

<section class="hero">
    <h1>⚽ Football Matches</h1>
    <p>Live scores, upcoming fixtures and completed matches.</p>
</section>

<div class="filters">
    <button class="filter active" onclick="loadMatches('today',this)">
        Today
    </button>

    <button class="filter" onclick="loadMatches('tomorrow',this)">
        Tomorrow
    </button>

    <button class="filter" onclick="loadMatches('yesterday',this)">
        Yesterday
    </button>
</div>

<main class="container">

    <div class="topbar">
        <h2 id="heading">Today's Matches</h2>

        <div>
            <span class="updated" id="updated">
                Loading...
            </span>

            <button class="refresh" onclick="loadMatches(currentDay)">
                ↻ Refresh
            </button>
        </div>
    </div>

    <div id="matches">
        <div class="loading">
            ⚽ Loading football matches...
        </div>
    </div>

</main>

<footer>
    © 2026 FootyHub • Football Match Centre
</footer>

<script>

let currentDay = "today";

/* Convert date to YYYY-MM-DD */

function getDate(day){

    const date = new Date();

    if(day === "tomorrow"){
        date.setDate(date.getDate()+1);
    }

    if(day === "yesterday"){
        date.setDate(date.getDate()-1);
    }

    return date.toISOString().split("T")[0];
}


/* Load our generated football data */

async function loadMatches(day="today",button=null){

    currentDay = day;

    if(button){

        document
        .querySelectorAll(".filter")
        .forEach(b=>b.classList.remove("active"));

        button.classList.add("active");
    }

    const heading =
        document.getElementById("heading");

    if(day==="today")
        heading.textContent="Today's Matches";

    if(day==="tomorrow")
        heading.textContent="Tomorrow's Matches";

    if(day==="yesterday")
        heading.textContent="Yesterday's Matches";

    const container =
        document.getElementById("matches");

    container.innerHTML =
        `<div class="loading">⚽ Loading matches...</div>`;

    try{

        const response =
            await fetch("football-data.json?"+Date.now());

        if(!response.ok)
            throw new Error("Football data unavailable");

        const data =
            await response.json();

        const date =
            getDate(day);

        const games =
            data.matches.filter(match =>
                match.date === date
            );

        renderMatches(games);

        document.getElementById("updated").textContent =
            "Updated: "+new Date().toLocaleTimeString();

    }
    catch(error){

        console.error(error);

        container.innerHTML = `
            <div class="error">
                <h3>Unable to load football data</h3>
                <p>Please try again in a moment.</p>
            </div>
        `;
    }
}


/* Render matches */

function renderMatches(games){

    const container =
        document.getElementById("matches");

    if(!games.length){

        container.innerHTML = `
            <div class="empty">
                <h3>No matches found</h3>
                <p>There are no available matches for this date.</p>
            </div>
        `;

        return;
    }

    const leagues = {};

    games.forEach(game=>{

        if(!leagues[game.league])
            leagues[game.league]=[];

        leagues[game.league].push(game);
    });

    container.innerHTML="";

    Object.keys(leagues).forEach(leagueName=>{

        const section =
            document.createElement("section");

        section.className="league";

        section.innerHTML=`
            <div class="league-title">
                <h3>🏆 ${leagueName}</h3>
                <span>${leagues[leagueName][0].country || ""}</span>
            </div>
        `;

        leagues[leagueName].forEach(game=>{

            const match =
                document.createElement("div");

            match.className="match";

            let status =
                game.status || "Scheduled";

            let statusClass =
                game.live ? "live" : "";

            let middle;

            if(game.homeScore !== null &&
               game.awayScore !== null){

                middle =
                    `<div class="score">
                        ${game.homeScore} - ${game.awayScore}
                     </div>`;

            }else{

                middle =
                    `<div class="time">
                        ${game.time || "TBA"}
                     </div>`;
            }

            match.innerHTML=`

                <div class="team home">

                    <span>${game.home}</span>

                    ${
                        game.homeLogo
                        ? `<img src="${game.homeLogo}" alt="">`
                        : "⚽"
                    }

                </div>

                <div class="match-info">

                    ${middle}

                    <div class="status ${statusClass}">
                        ${status}
                    </div>

                </div>

                <div class="team">

                    ${
                        game.awayLogo
                        ? `<img src="${game.awayLogo}" alt="">`
                        : "⚽"
                    }

                    <span>${game.away}</span>

                </div>
            `;

            section.appendChild(match);

        });

        container.appendChild(section);

    });
}


/* Initial load */

loadMatches("today");


/* Refresh every 60 seconds */

setInterval(()=>{
    loadMatches(currentDay);
},60000);

</script>

</body>
</html>
