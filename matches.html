<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FootyHub - Football Matches</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #17202a;
}

header {
    background: #071952;
    color: white;
    padding: 20px;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 26px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 18px;
    font-size: 15px;
}

nav a:hover {
    text-decoration: underline;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
}

.hero {
    background: white;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.hero h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.hero p {
    color: #667085;
}

.tabs {
    display: flex;
    gap: 10px;
    margin: 20px 0;
    flex-wrap: wrap;
}

.tab {
    border: none;
    background: white;
    padding: 12px 20px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.tab.active {
    background: #071952;
    color: white;
}

.status {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    color: #667085;
}

.error {
    background: #fff1f0;
    color: #b42318;
    border: 1px solid #fecdca;
}

.league {
    background: white;
    border-radius: 15px;
    margin-bottom: 20px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.league-header {
    background: #071952;
    color: white;
    padding: 15px 20px;
    font-size: 18px;
    font-weight: bold;
}

.match {
    display: grid;
    grid-template-columns: 1fr 110px 1fr;
    align-items: center;
    gap: 15px;
    padding: 20px;
    border-bottom: 1px solid #eaecf0;
}

.match:last-child {
    border-bottom: none;
}

.team {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: bold;
}

.team.home {
    justify-content: flex-end;
    text-align: right;
}

.team.away {
    justify-content: flex-start;
}

.team img {
    width: 38px;
    height: 38px;
    object-fit: contain;
}

.score {
    text-align: center;
}

.score-number {
    font-size: 22px;
    font-weight: bold;
}

.match-time {
    display: block;
    margin-top: 5px;
    font-size: 12px;
    color: #667085;
}

.live {
    color: #d92d20;
    font-weight: bold;
}

.finished {
    color: #027a48;
    font-weight: bold;
}

.scheduled {
    color: #175cd3;
    font-weight: bold;
}

.no-matches {
    background: white;
    padding: 40px 25px;
    text-align: center;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.no-matches h2 {
    margin-bottom: 10px;
}

.loading {
    text-align: center;
    padding: 30px;
    background: white;
    border-radius: 15px;
}

footer {
    text-align: center;
    padding: 30px;
    color: #667085;
}

@media(max-width: 650px) {

    .header-inner {
        flex-direction: column;
        gap: 15px;
    }

    nav a {
        margin: 0 6px;
    }

    .hero h1 {
        font-size: 24px;
    }

    .match {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 10px;
    }

    .team.home,
    .team.away {
        justify-content: center;
        text-align: center;
    }

    .score {
        order: 3;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">⚽ FootyHub</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="matches.html">Matches</a>
            <a href="leagues.html">Leagues</a>
            <a href="standings.html">Standings</a>
        </nav>

    </div>
</header>


<main class="container">

    <section class="hero">
        <h1>⚽ Football Matches</h1>
        <p>Live, upcoming and completed football matches.</p>
    </section>


    <div class="tabs">

        <button class="tab active"
                onclick="changeDate('today', this)">
            Today
        </button>

        <button class="tab"
                onclick="changeDate('tomorrow', this)">
            Tomorrow
        </button>

        <button class="tab"
                onclick="changeDate('yesterday', this)">
            Yesterday
        </button>

    </div>


    <div id="status" class="status">
        ⏳ Loading football matches...
    </div>


    <div id="matches">
        <div class="loading">
            Loading matches...
        </div>
    </div>

</main>


<footer>
    <strong>⚽ FootyHub</strong>
    <br>
    Your football world in one place.
    <br><br>
    Live Scores • Fixtures • Results • Tables
    <br><br>
    © 2026 FootyHub
</footer>


<script>

/* =========================================
   FOOTYHUB MATCHES
========================================= */

const API =
    "https://site.api.espn.com/apis/site/v2/sports/soccer";


/*
   Competitions to display
*/
const LEAGUES = [

    {
        id: "eng.1",
        name: "Premier League"
    },

    {
        id: "esp.1",
        name: "La Liga"
    },

    {
        id: "ger.1",
        name: "Bundesliga"
    },

    {
        id: "ita.1",
        name: "Serie A"
    },

    {
        id: "fra.1",
        name: "Ligue 1"
    },

    {
        id: "uefa.champions",
        name: "UEFA Champions League"
    }

];


let selectedDate = "today";


/* =========================================
   GET LOCAL DATE
========================================= */

function getDate(type) {

    const date = new Date();

    if (type === "tomorrow") {
        date.setDate(date.getDate() + 1);
    }

    if (type === "yesterday") {
        date.setDate(date.getDate() - 1);
    }

    const year = date.getFullYear();

    const month =
        String(date.getMonth() + 1).padStart(2, "0");

    const day =
        String(date.getDate()).padStart(2, "0");


    /*
       ESPN expects YYYYMMDD
    */

    return `${year}${month}${day}`;
}


/* =========================================
   DISPLAY DATE
========================================= */

function getReadableDate(type) {

    const date = new Date();

    if (type === "tomorrow") {
        date.setDate(date.getDate() + 1);
    }

    if (type === "yesterday") {
        date.setDate(date.getDate() - 1);
    }

    return date.toLocaleDateString(
        "en-IN",
        {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );
}


/* =========================================
   CHANGE DATE
========================================= */

function changeDate(type, button) {

    selectedDate = type;


    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.remove("active");

        });


    button.classList.add("active");


    loadMatches();

}


/* =========================================
   LOAD MATCHES
========================================= */

async function loadMatches() {

    const container =
        document.getElementById("matches");

    const status =
        document.getElementById("status");


    container.innerHTML = `
        <div class="loading">
            ⏳ Loading matches...
        </div>
    `;


    status.className = "status";

    status.innerHTML =
        `⏳ Loading matches for ${getReadableDate(selectedDate)}...`;


    const date = getDate(selectedDate);


    try {

        /*
           Fetch all six competitions
        */

        const requests =
            LEAGUES.map(async league => {

                const url =
                    `${API}/${league.id}/scoreboard?dates=${date}`;

                try {

                    const response =
                        await fetch(
                            url + "&_=" + Date.now(),
                            {
                                cache: "no-store"
                            }
                        );


                    if (!response.ok) {

                        console.warn(
                            "Could not load:",
                            league.name,
                            response.status
                        );

                        return {
                            league,
                            events: []
                        };

                    }


                    const data =
                        await response.json();


                    return {
                        league,
                        events: data.events || []
                    };

                }

                catch (error) {

                    console.error(
                        league.name,
                        error
                    );

                    return {
                        league,
                        events: []
                    };

                }

            });


        const results =
            await Promise.all(requests);


        renderMatches(results);


    }

    catch (error) {

        console.error(error);


        status.className =
            "status error";


        status.innerHTML = `
            ❌ <strong>Unable to load football matches.</strong>
            <br><br>
            Please refresh the page and try again.
        `;


        container.innerHTML = `
            <div class="no-matches">

                <h2>Something went wrong</h2>

                <p>
                    We couldn't retrieve the football matches.
                </p>

            </div>
        `;

    }

}


/* =========================================
   RENDER MATCHES
========================================= */

function renderMatches(results) {

    const container =
        document.getElementById("matches");

    const status =
        document.getElementById("status");


    container.innerHTML = "";


    let totalMatches = 0;


    results.forEach(result => {

        if (
            !result.events ||
            result.events.length === 0
        ) {

            return;

        }


        totalMatches += result.events.length;


        const leagueDiv =
            document.createElement("div");


        leagueDiv.className =
            "league";


        leagueDiv.innerHTML = `
            <div class="league-header">
                ${result.league.name}
            </div>
        `;


        /*
           Sort matches by kick-off time
        */

        result.events.sort((a, b) => {

            return new Date(a.date) -
                   new Date(b.date);

        });


        result.events.forEach(game => {

            leagueDiv.appendChild(
                createMatch(game)
            );

        });


        container.appendChild(
            leagueDiv
        );

    });


    if (totalMatches === 0) {

        container.innerHTML = `
            <div class="no-matches">

                <h2>⚽ No matches found</h2>

                <br>

                <p>
                    There are no matches from the
                    selected competitions on
                    <strong>
                        ${getReadableDate(selectedDate)}
                    </strong>.
                </p>

                <br>

                <p>
                    Try selecting another date.
                </p>

            </div>
        `;


        status.innerHTML =
            `ℹ️ No matches found for ${getReadableDate(selectedDate)}.`;

        return;

    }


    status.innerHTML =
        `✅ ${totalMatches} match${totalMatches === 1 ? "" : "es"} found • ${getReadableDate(selectedDate)}`;

}


/* =========================================
   CREATE MATCH CARD
========================================= */

function createMatch(game) {

    const div =
        document.createElement("div");


    div.className =
        "match";


    const competition =
        game.competitions &&
        game.competitions[0];


    if (!competition) {

        return div;

    }


    const competitors =
        competition.competitors || [];


    const home =
        competitors.find(
            team => team.homeAway === "home"
        );


    const away =
        competitors.find(
            team => team.homeAway === "away"
        );


    const homeName =
        home?.team?.displayName ||
        home?.team?.shortDisplayName ||
        "Home";


    const awayName =
        away?.team?.displayName ||
        away?.team?.shortDisplayName ||
        "Away";


    const homeLogo =
        home?.team?.logo ||
        "";


    const awayLogo =
        away?.team?.logo ||
        "";


    const homeScore =
        home?.score ??
        "-";


    const awayScore =
        away?.score ??
        "-";


    const gameStatus =
        game.status?.type;


    const state =
        gameStatus?.state ||
        "pre";


    const detail =
        gameStatus?.shortDetail ||
        gameStatus?.detail ||
        "";


    let statusText =
        detail || "Upcoming";


    let statusClass =
        "scheduled";


    /*
       LIVE
    */

    if (state === "in") {

        statusText =
            "🔴 LIVE";

        statusClass =
            "live";

    }


    /*
       COMPLETED
    */

    else if (state === "post") {

        statusText =
            "Finished";

        statusClass =
            "finished";

    }


    /*
       UPCOMING
    */

    else {

        statusClass =
            "scheduled";


        statusText =
            detail || "Upcoming";

    }


    /*
       Match time
    */

    let formattedTime =
        "";


    if (game.date) {

        try {

            formattedTime =
                new Date(game.date)
                    .toLocaleTimeString(
                        "en-IN",
                        {
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    );

        }

        catch {

            formattedTime = "";

        }

    }


    div.innerHTML = `

        <div class="team home">

            <span>
                ${escapeHTML(homeName)}
            </span>

            ${
                homeLogo
                ?
                `<img
                    src="${homeLogo}"
                    alt="${escapeHTML(homeName)} logo"
                >`
                :
                `<span>⚽</span>`
            }

        </div>


        <div class="score">

            <div class="score-number">
                ${homeScore} - ${awayScore}
            </div>


            <span class="match-time ${statusClass}">
                ${escapeHTML(statusText)}
            </span>


            ${
                formattedTime
                ?
                `
                <span class="match-time">
                    ${formattedTime}
                </span>
                `
                :
                ""
            }

        </div>


        <div class="team away">

            ${
                awayLogo
                ?
                `<img
                    src="${awayLogo}"
                    alt="${escapeHTML(awayName)} logo"
                >`
                :
                `<span>⚽</span>`
            }


            <span>
                ${escapeHTML(awayName)}
            </span>

        </div>

    `;


    return div;

}


/* =========================================
   SECURITY / TEXT CLEANING
========================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";


    return div.innerHTML;

}


/* =========================================
   START
========================================= */

loadMatches();


/*
   Refresh every 2 minutes
   so live scores can update.
*/

setInterval(
    loadMatches,
    120000
);

</script>

</body>
</html>
